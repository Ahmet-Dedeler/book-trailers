<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"Space Mono",monospace; color:#F2F4F8; }
        .world { position:absolute; inset:0; }
        .scrim { position:absolute; inset:0;
                 background:radial-gradient(ellipse 66% 100% at 4% 50%,
                   rgba(7,8,11,.97) 10%, rgba(7,8,11,.84) 44%, rgba(7,8,11,0) 80%); }
        .stage { position:absolute; left:150px; top:0; bottom:0; width:1020px;
                 display:flex; flex-direction:column; justify-content:center; }
        .readout { display:flex; align-items:baseline; gap:22px; font-size:26px; letter-spacing:.26em;
                   color:#79839B; text-transform:uppercase; margin-bottom:26px; opacity:0; white-space:nowrap; }
        .readout b { font-weight:700; color:#FF3B1F; font-size:34px; letter-spacing:.1em; display:inline-block;
                     min-width:70px; font-variant-numeric:tabular-nums; }
        .readout i { display:block; width:56px; height:2px; background:#FF3B1F; }
        .rule { height:2px; background:#FF3B1F; width:100%; margin:0 0 30px; transform-origin:left center; }
        .disp { font-family:"Archivo Black",sans-serif; font-weight:400; text-transform:uppercase;
                line-height:.96; letter-spacing:-.03em; font-size:112px; white-space:nowrap; }
        .disp span { display:inline-block; opacity:0; }
        .flame-t { color:#FF3B1F; }
        .meta { margin-top:34px; font-size:25px; letter-spacing:.2em; color:#79839B;
                text-transform:uppercase; opacity:0; white-space:nowrap; }
        /* the countdown ring wraps the vehicle in the 3D world */
        .ring { position:absolute; left:1090px; top:190px; width:700px; height:700px; }
        .ring svg { display:block; width:700px; height:700px; }
      </style>

      <div id="root" data-composition-id="s1-ignition" data-start="0" data-duration="7.5"
           data-width="1920" data-height="1080">
        <div class="world" id="s1-world">
          <div class="scrim" data-layout-ignore aria-hidden="true"></div>

          <div class="ring" id="s1-ring" data-layout-ignore aria-hidden="true">
            <svg viewBox="0 0 700 700" fill="none">
              <circle cx="350" cy="350" r="300" stroke="rgba(121,131,155,.35)" stroke-width="2"/>
              <g id="s1-ticks" stroke="#79839B" stroke-width="2"></g>
              <circle id="s1-arc" cx="350" cy="350" r="300" stroke="#F2F4F8" stroke-width="4"
                      stroke-linecap="butt" transform="rotate(-90 350 350)"/>
              <circle id="s1-flame" cx="350" cy="350" r="318" stroke="#FF3B1F" stroke-width="6" opacity="0"
                      transform="rotate(-90 350 350)"/>
              <text id="s1-ringlab" x="350" y="676" text-anchor="middle" fill="#79839B"
                    font-family="Space Mono, monospace" font-size="20" letter-spacing="5" opacity="0">LAUNCH WINDOW</text>
            </svg>
          </div>

          <div class="stage">
            <div class="readout" id="s1-readout"><i></i><span>T-minus</span><b id="s1-count">10</b></div>
            <div class="rule" id="s1-rule"></div>
            <div class="disp"><span id="s1-l1">Most</span></div>
            <div class="disp"><span id="s1-l2">ambition</span></div>
            <div class="disp"><span id="s1-l3">never</span></div>
            <div class="disp"><span id="s1-l4">leaves</span></div>
            <div class="disp"><span id="s1-l5" class="flame-t">the ground.</span></div>
            <div class="meta" id="s1-meta">A manual for the ones who launch.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 7.5, OUT = 0.5, IGN = 4.15;
          var tl = gsap.timeline({ paused: true });

          /* ---- scene 1 opens from black on its own terms (no IN handoff) ---- */
          tl.fromTo("#s1-world", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0);

          /* ring ticks, laid out once at build (36 of them, every 10°) */
          var ticks = document.getElementById("s1-ticks"), th = "";
          for (var i = 0; i < 36; i++) {
            var a = i * 10 * Math.PI / 180, big = i % 9 === 0;
            var r0 = big ? 272 : 284, r1 = 296;
            th += '<line x1="' + (350 + Math.cos(a) * r0).toFixed(1) + '" y1="' + (350 + Math.sin(a) * r0).toFixed(1) +
                  '" x2="' + (350 + Math.cos(a) * r1).toFixed(1) + '" y2="' + (350 + Math.sin(a) * r1).toFixed(1) + '"/>';
          }
          ticks.innerHTML = th;

          /* --- rule: counting-dynamic-scale — the count steps every 0.4s and pops on each step --- */
          var count = document.getElementById("s1-count");
          var clock = { t: 0 };
          tl.to(clock, {
            t: DUR, duration: DUR, ease: "none",
            onUpdate: function () {
              var tt = tl.time();
              var n = tt < 0.15 ? 10 : Math.max(0, 10 - Math.floor((tt - 0.15) / 0.4));
              count.textContent = tt >= IGN ? "IGNITION" : String(n);
            }
          }, 0);
          tl.fromTo("#s1-readout", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.15);
          for (var k = 1; k <= 10; k++) {
            tl.fromTo("#s1-count", { scale: 1.45 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 0.15 + k * 0.4);
          }
          tl.fromTo("#s1-count", { scale: 1.6 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, IGN);
          tl.fromTo("#s1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.out" }, 0.35);

          /* --- rule: svg-path-draw (reversed) — the launch-window arc drains to zero at ignition --- */
          var arc = document.getElementById("s1-arc"), L = 2 * Math.PI * 300;
          arc.style.strokeDasharray = L;
          var arcP = { off: 0 };
          function writeArc() { arc.style.strokeDashoffset = arcP.off; }
          writeArc();
          tl.fromTo("#s1-ring", { opacity: 0, scale: 0.86, transformOrigin: "50% 50%" },
                                { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0.2);
          tl.fromTo(arcP, { off: 0 }, { off: L, duration: IGN - 0.15, ease: "none", onUpdate: writeArc }, 0.15);
          tl.fromTo("#s1-ringlab", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.8);
          /* ignition: the flame ring blooms, then the ring lets the vehicle go */
          var flame = document.getElementById("s1-flame");
          flame.style.strokeDasharray = 2 * Math.PI * 318;
          var flP = { off: 2 * Math.PI * 318 };
          function writeFl() { flame.style.strokeDashoffset = flP.off; }
          writeFl();
          tl.fromTo("#s1-flame", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, IGN);
          tl.to(flP, { off: 0, duration: 0.55, ease: "power3.out", onUpdate: writeFl }, IGN);
          tl.to("#s1-flame", { opacity: 0.35, duration: 1.2, ease: "power2.out" }, IGN + 0.6);
          tl.to("#s1-ring", { scale: 1.08, opacity: 0.55, duration: 1.6, ease: "power2.out" }, IGN + 0.4);
          /* the ring keeps a heartbeat until launch */
          var rc = 0.8, rr = Math.max(0, Math.floor((IGN - 0.9) / rc) - 1);
          tl.to("#s1-ticks", { opacity: 0.45, duration: rc / 2, ease: "sine.inOut", yoyo: true, repeat: rr * 2 + 1 }, 0.9);

          /* --- rule: waterfall-entry — one word per line, each on a count, the last one slams on the drop --- */
          var wave = [["#s1-l1", 1.15, 70, 0.22], ["#s1-l2", 1.55, 70, 0.22], ["#s1-l3", 1.95, 70, 0.22],
                      ["#s1-l4", 2.35, 70, 0.22]];
          wave.forEach(function (w) {
            tl.set(w[0], { opacity: 1, y: w[2] }, w[1]);
            tl.to(w[0], { y: 0, duration: w[3], ease: "power4.out" }, w[1]);
          });
          tl.set("#s1-l5", { opacity: 1 }, 2.95);
          tl.fromTo("#s1-l5", { scale: 1.4, filter: "blur(12px)" },
                              { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out", transformOrigin: "left center" }, 2.95);
          tl.set("#s1-l5", { filter: "none" }, 3.45);
          tl.fromTo("#s1-meta", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, IGN + 0.9);

          /* lift-off shakes the type block for four frames, then it settles */
          tl.fromTo(".stage", { y: 0 }, { y: 6, duration: 0.06, yoyo: true, repeat: 5, ease: "none" }, IGN);

          /* ---- handoff OUT: the whip (s2 streaks in on the same window) ---- */
          tl.set("#s1-world", { filter: "blur(0px)" }, DUR - OUT);
          tl.to("#s1-world", { opacity: 0, x: -220, skewX: -6, filter: "blur(14px)", duration: OUT, ease: "power3.in" }, DUR - OUT);

          tl.to({}, { duration: DUR }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["s1-ignition"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
