<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"Space Mono",monospace; color:#F2F4F8; }
        .world { position:absolute; inset:0; }
        .scrim { position:absolute; inset:0;
                 background:radial-gradient(ellipse 78% 68% at 50% 56%,
                   rgba(7,8,11,.94) 18%, rgba(7,8,11,0) 80%); }
        .stage { position:absolute; left:150px; top:0; bottom:0; width:1620px;
                 display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
        .part  { display:flex; align-items:center; justify-content:center; gap:20px; font-size:26px; letter-spacing:.26em;
                 color:#FF3B1F; text-transform:uppercase; margin-bottom:34px; opacity:0; white-space:nowrap; }
        .part i { display:block; width:56px; height:2px; background:#FF3B1F; }
        .disp  { font-family:"Archivo Black",sans-serif; font-weight:400; text-transform:uppercase;
                 line-height:.96; letter-spacing:-.03em; font-size:144px; white-space:nowrap; }
        .disp span { display:inline-block; opacity:0; }
        .flame-t { color:#FF3B1F; }
        /* spec card */
        .card  { position:relative; margin-top:44px; padding:24px 34px; background:rgba(7,8,11,.78);
                 border:2px solid rgba(121,131,155,.55); opacity:0; white-space:nowrap; text-transform:uppercase; }
        .card .corner { position:absolute; left:-2px; top:-2px; width:22px; height:22px;
                        border-top:3px solid #FF3B1F; border-left:3px solid #FF3B1F; }
        .card .who { font-size:24px; letter-spacing:.12em; color:#79839B; }
        .card .q   { font-size:28px; letter-spacing:.12em; color:#F2F4F8; margin-left:14px; }
        /* the transfer diagram — full frame, behind the type, over the 3D planets */
        .diagram { position:absolute; inset:0; }
        .diagram svg { display:block; width:1920px; height:1080px; }
      </style>

      <div id="root" data-composition-id="s7-multiplanetary" data-start="0" data-duration="7"
           data-width="1920" data-height="1080">
        <div class="world" id="s7-world">
          <div class="scrim" data-layout-ignore aria-hidden="true"></div>

          <div class="diagram" id="s7-dia" data-layout-ignore aria-hidden="true">
            <svg viewBox="0 0 1920 1080" fill="none">
              <path id="s7-arc" d="M 300 900 Q 960 -30 1660 250" stroke="#79839B" stroke-width="2"/>
              <ellipse id="s7-orb1" cx="300" cy="900" rx="300" ry="90" stroke="rgba(121,131,155,.75)" stroke-width="2" opacity="0"/>
              <ellipse id="s7-orb2" cx="1660" cy="250" rx="250" ry="76" stroke="rgba(121,131,155,.75)" stroke-width="2" opacity="0"/>
              <text id="s7-lab1" x="300" y="990" text-anchor="middle" fill="#79839B" font-family="Space Mono, monospace"
                    font-size="20" letter-spacing="4.8" opacity="0">EARTH · DEPARTURE</text>
              <text id="s7-lab2" x="1660" y="330" text-anchor="middle" fill="#79839B" font-family="Space Mono, monospace"
                    font-size="20" letter-spacing="4.8" opacity="0">MARS · ARRIVAL</text>
              <circle id="s7-halo" cx="300" cy="900" r="16" fill="rgba(242,244,248,.25)" opacity="0"/>
              <circle id="s7-light" cx="300" cy="900" r="6" fill="#F2F4F8" opacity="0"/>
            </svg>
          </div>

          <div class="stage">
            <div class="part" id="s7-part"><i></i>Part IV — On behalf of humanity</div>
            <div class="disp"><span id="s7-l1">Preserve</span></div>
            <div class="disp"><span id="s7-l2">the light of</span></div>
            <div class="disp"><span id="s7-l3" class="flame-t">consciousness.</span></div>
            <div class="card" id="s7-card">
              <i class="corner" id="s7-corner"></i>
              <span class="who">— Elon Musk &#160;·</span><span class="q">"Becoming Multiplanetary"</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 7, IN = 0.5, OUT = 0.5;
          var DRAW = 0.55, LIGHT = 1.55, TRAVEL = 3.1;   /* the 3D tube fades in 47.05 → 48.05; the spark flies 48.05 → 51.15 */
          var tl = gsap.timeline({ paused: true });
          var cl = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
          var eInOut = function (x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };

          /* ---- handoff IN: the whip ---- */
          tl.fromTo("#s7-world", { opacity: 0, x: 220, skewX: 6, filter: "blur(14px)" },
                                 { opacity: 1, x: 0, skewX: 0, filter: "blur(0px)", duration: IN, ease: "power3.out" }, 0);
          tl.set("#s7-world", { filter: "none" }, IN);

          /* --- rule: svg-path-draw — the transfer arc draws Earth → Mars on the tube's own window --- */
          var arc = document.getElementById("s7-arc"), L = arc.getTotalLength();
          arc.style.strokeDasharray = L;
          tl.fromTo(arc, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 1.0, ease: "none" }, DRAW);
          tl.fromTo("#s7-orb1", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, DRAW + 0.1);
          tl.fromTo("#s7-orb2", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, DRAW + 0.9);
          tl.fromTo("#s7-lab1", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, DRAW + 0.3);
          tl.fromTo("#s7-lab2", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, DRAW + 1.1);

          /* --- the light travels the arc (getPointAtLength) on the spark's window; orbits idle on a
                 bounded sine (rule: sine-wave-loop) — everything written from ONE setter-driven clock --- */
          var light = document.getElementById("s7-light"), halo = document.getElementById("s7-halo");
          var orb1 = document.getElementById("s7-orb1"), orb2 = document.getElementById("s7-orb2");
          function apply(t) {
            var p = eInOut(cl((t - LIGHT) / TRAVEL));
            var pt = arc.getPointAtLength(p * L);
            var on = cl((t - LIGHT + 0.05) / 0.3) * (1 - cl((t - (LIGHT + TRAVEL - 0.1)) / 0.4));
            light.setAttribute("cx", pt.x.toFixed(1)); light.setAttribute("cy", pt.y.toFixed(1));
            halo.setAttribute("cx", pt.x.toFixed(1)); halo.setAttribute("cy", pt.y.toFixed(1));
            halo.setAttribute("r", (16 * (1 + Math.sin(t * 6) * 0.12)).toFixed(2));
            light.setAttribute("opacity", on.toFixed(3)); halo.setAttribute("opacity", (on * 0.9).toFixed(3));
            gsap.set(orb1, { rotation: -28 + Math.sin(t * 1.1) * 7, svgOrigin: "300 900" });
            gsap.set(orb2, { rotation: -18 + Math.sin(t * 1.3 + 1.6) * 7, svgOrigin: "1660 250" });
          }
          var driver = { _t: 0 };
          Object.defineProperty(driver, "t", { get: function () { return this._t; },
            set: function (v) { this._t = v; apply(v); } });
          apply(0);
          tl.to(driver, { t: DUR, duration: DUR, ease: "none" }, 0);

          /* ---- blueprint: titlecard-reveal — one restrained move per line, then the hold ---- */
          tl.fromTo("#s7-part", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.9);
          [["#s7-l1", 1.15], ["#s7-l2", 1.4], ["#s7-l3", 1.65]].forEach(function (w) {
            tl.fromTo(w[0], { opacity: 0, y: 44, scale: 0.96, transformOrigin: "50% 100%" },
                            { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, w[1]);
          });
          /* spec card: slides in, then the flame corner draws */
          tl.fromTo("#s7-card", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.5);
          tl.fromTo("#s7-corner", { scale: 0, transformOrigin: "left top" }, { scale: 1, duration: 0.3, ease: "power3.out" }, 2.6);
          /* arrival: the flame line takes the Mars pop (global 51.0) */
          tl.to("#s7-l3", { scale: 1.03, duration: 0.22, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "50% 50%" }, LIGHT + TRAVEL - 0.15);

          /* ---- handoff OUT: the dip (opacity only — s8 rises through it) ---- */
          tl.to("#s7-world", { opacity: 0, duration: OUT, ease: "power2.in" }, DUR - OUT);

          tl.to({}, { duration: DUR }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["s7-multiplanetary"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
