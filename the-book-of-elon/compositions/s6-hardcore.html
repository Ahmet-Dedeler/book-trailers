<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"Space Mono",monospace; color:#F2F4F8; }
        .world { position:absolute; inset:0; }
        .scrim { position:absolute; inset:0;
                 background:radial-gradient(ellipse 68% 100% at 6% 50%,
                   rgba(7,8,11,.97) 12%, rgba(7,8,11,.82) 46%, rgba(7,8,11,0) 82%); }
        .stage { position:absolute; left:150px; top:0; bottom:0; width:1020px;
                 display:flex; flex-direction:column; justify-content:center; }
        .part  { display:flex; align-items:center; gap:20px; font-size:26px; letter-spacing:.26em;
                 color:#FF3B1F; text-transform:uppercase; margin-bottom:30px; opacity:0; white-space:nowrap; }
        .part i { display:block; width:56px; height:2px; background:#FF3B1F; }
        /* EAT GLASS. — three stacked echoes in one grid cell: flame ghost, dim ghost, the base on top */
        .glitch { display:grid; opacity:0; }
        .g { grid-area:1 / 1; font-family:"Archivo Black",sans-serif; font-weight:400; text-transform:uppercase;
             line-height:.96; letter-spacing:-.03em; font-size:126px; white-space:nowrap; }
        .g-base { z-index:2; }
        .g-ghost { z-index:1; opacity:0; mix-blend-mode:screen; will-change:transform; }
        .g-warm { color:#FF3B1F; }
        .g-cool { color:#79839B; }
        .disp  { font-family:"Archivo Black",sans-serif; font-weight:400; text-transform:uppercase;
                 line-height:.96; letter-spacing:-.03em; font-size:126px; white-space:nowrap; }
        .disp span { display:inline-block; opacity:0; }
        .flame-t { color:#FF3B1F; }
        .meta  { margin-top:26px; font-size:27px; letter-spacing:.16em; color:#79839B; line-height:1.7;
                 text-transform:uppercase; white-space:nowrap; }
        .meta div { opacity:0; }
        .readout { margin-top:28px; width:640px; opacity:0; }
        .rhead { display:flex; justify-content:space-between; align-items:baseline; font-size:24px; letter-spacing:.2em;
                 color:#79839B; text-transform:uppercase; margin-bottom:12px; }
        .rhead b { color:#F2F4F8; font-weight:700; font-variant-numeric:tabular-nums; min-width:90px;
                   text-align:right; display:inline-block; }
        .track { height:14px; background:rgba(121,131,155,.24); position:relative; overflow:hidden; }
        .fill  { position:absolute; left:0; top:0; width:100%; height:14px; background:#FF3B1F; }
        /* the waveform reads the 3D ridges like an instrument */
        .diagram { position:absolute; left:1150px; top:0; width:770px; height:1080px; }
        .diagram svg { display:block; width:770px; height:1080px; }
      </style>

      <div id="root" data-composition-id="s6-hardcore" data-start="0" data-duration="8"
           data-width="1920" data-height="1080">
        <div class="world" id="s6-world">
          <div class="scrim" data-layout-ignore aria-hidden="true"></div>

          <div class="diagram" id="s6-dia" data-layout-ignore aria-hidden="true">
            <svg viewBox="0 0 770 1080" fill="none">
              <line id="s6-base" x1="60" y1="860" x2="720" y2="860" stroke="rgba(121,131,155,.7)" stroke-width="2"/>
              <polyline id="s6-wave" points="" stroke="#F2F4F8" stroke-width="3" stroke-linejoin="round"/>
              <rect id="s6-load" x="60" y="862" width="660" height="7" fill="#FF3B1F"/>
              <line id="s6-needle" x1="60" y1="860" x2="60" y2="860" stroke="#79839B" stroke-width="2" stroke-dasharray="6 6" opacity="0"/>
              <circle id="s6-dot" cx="60" cy="860" r="8" stroke="#79839B" stroke-width="3" opacity="0"/>
              <text id="s6-lab" x="60" y="840" text-anchor="middle" fill="#79839B" font-family="Space Mono, monospace"
                    font-size="20" letter-spacing="4" opacity="0">R-01</text>
              <text id="s6-cap" x="60" y="906" fill="#79839B" font-family="Space Mono, monospace"
                    font-size="20" letter-spacing="4.8" opacity="0">LOAD · 14 RIDGES</text>
            </svg>
          </div>

          <div class="stage">
            <div class="part" id="s6-part"><i></i>Part II — Ultra hardcore work</div>
            <div class="glitch" id="s6-glitch">
              <span class="g g-ghost g-warm" id="s6-gw" data-layout-ignore aria-hidden="true">Eat glass.</span>
              <span class="g g-ghost g-cool" id="s6-gc" data-layout-ignore aria-hidden="true">Eat glass.</span>
              <span class="g g-base">Eat glass.</span>
            </div>
            <div class="disp"><span id="s6-l1">Stare</span></div>
            <div class="disp"><span id="s6-l2">into the</span></div>
            <div class="disp"><span id="s6-l3" class="flame-t">abyss.</span></div>
            <div class="meta">
              <div id="s6-m1">Sleep on the factory floor</div>
              <div id="s6-m2">Adversity forges strength</div>
            </div>
            <div class="readout" id="s6-ro">
              <div class="rhead"><span>Intensity</span><b id="s6-pct">0%</b></div>
              <div class="track"><div class="fill" id="s6-fill"></div></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 8, IN = 0.5, OUT = 0.5;
          var PULSE = 0.35, BEATS = [0.55, 1.25, 1.6, 1.95];   /* one tempo grid for every slam */
          var GRIND = 2.5, GRIND_DUR = 2.2;                       /* the 3D bar fills 41.5 → 43.7 global */
          var tl = gsap.timeline({ paused: true });
          var cl = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
          var eInOut = function (x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };

          /* ---- handoff IN: the whip ---- */
          tl.fromTo("#s6-world", { opacity: 0, x: 220, skewX: 6, filter: "blur(14px)" },
                                 { opacity: 1, x: 0, skewX: 0, filter: "blur(0px)", duration: IN, ease: "power3.out" }, 0);
          tl.set("#s6-world", { filter: "none" }, IN);

          /* ---- the waveform: 14 peaks from the same height formula as the 3D ridges ---- */
          var BASE = 860, V = [[60.5, BASE]];
          for (var i = 0; i < 14; i++) {
            var h = 1.4 + Math.abs(Math.sin(i * 2.3)) * 5.4, x = 84 + i * 47;
            V.push([x, BASE - h * 50]); V.push([x + 23.5, BASE]);
          }
          var wave = document.getElementById("s6-wave");
          wave.setAttribute("points", V.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "));
          /* --- rule: svg-path-draw — the base, then the waveform, left to right in 1.2s --- */
          var base = document.getElementById("s6-base");
          base.style.strokeDasharray = 660;
          tl.fromTo(base, { strokeDashoffset: 660 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 0.5);
          var WL = wave.getTotalLength();
          wave.style.strokeDasharray = WL;
          tl.fromTo(wave, { strokeDashoffset: WL }, { strokeDashoffset: 0, duration: 1.2, ease: "none" }, 0.7);
          tl.fromTo("#s6-cap", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, 1.9);
          /* --- rule: stat-bars-and-fills — the flame load bar grinds along the base on the 3D bar's window --- */
          tl.fromTo("#s6-load", { scaleX: 0, svgOrigin: "60 865" }, { scaleX: 1, duration: GRIND_DUR, ease: "power1.inOut" }, GRIND);
          tl.fromTo(["#s6-needle", "#s6-dot", "#s6-lab"], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, GRIND - 0.05);

          /* --- rule: chart-scrub-readout — a dim needle rides the peaks; ONE driver, index-guarded label --- */
          var needle = document.getElementById("s6-needle"), dot = document.getElementById("s6-dot"), lab = document.getElementById("s6-lab");
          var lastIdx = -1;
          function scrub(t) {
            var p = eInOut(cl((t - GRIND) / GRIND_DUR));
            var f = p * (V.length - 1), k = Math.min(V.length - 2, Math.floor(f)), u = f - k;
            var x = V[k][0] + (V[k + 1][0] - V[k][0]) * u, y = V[k][1] + (V[k + 1][1] - V[k][1]) * u;
            needle.setAttribute("x1", x.toFixed(1)); needle.setAttribute("x2", x.toFixed(1)); needle.setAttribute("y2", y.toFixed(1));
            dot.setAttribute("cx", x.toFixed(1)); dot.setAttribute("cy", y.toFixed(1));
            lab.setAttribute("x", x.toFixed(1)); lab.setAttribute("y", (y - 22).toFixed(1));
            var idx = Math.round(p * 13);
            if (idx !== lastIdx) { lab.textContent = "R-" + (idx < 9 ? "0" : "") + (idx + 1); lastIdx = idx; }
          }

          /* --- rule: chromatic-glitch — ghosts jitter on a hash of quantised time under a finite envelope --- */
          var gw = document.getElementById("s6-gw"), gc = document.getElementById("s6-gc");
          var ENV = [[BEATS[0], 0.45], [5.0, 0.16], [5.3, 0.13]];   /* entrance, then two emphasis bursts */
          function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
          function glitch(t) {
            var amp = 0;
            for (var e = 0; e < ENV.length; e++) {
              var u = (t - ENV[e][0]) / ENV[e][1];
              if (u >= 0 && u < 1) amp = Math.max(amp, 1 - u * u * u);
            }
            var step = Math.floor(t * 24);
            [gw, gc].forEach(function (el, layer) {
              var jx = (hash(step * 13 + layer * 7) * 2 - 1) * 14 * amp;
              var jy = (hash(step * 29 + layer * 11) * 2 - 1) * 5 * amp;
              gsap.set(el, { x: jx, y: jy, opacity: amp > 0 ? 0.85 : 0 });
            });
          }

          /* every per-frame value is written from a property SETTER (seek() suppresses callbacks) */
          var driver = { _t: 0 };
          Object.defineProperty(driver, "t", { get: function () { return this._t; },
            set: function (v) { this._t = v; scrub(v); glitch(v); } });
          scrub(0); glitch(0);
          tl.to(driver, { t: DUR, duration: DUR, ease: "none" }, 0);

          /* ---- rule: kinetic-beat-slam — four phrases, four different attacks, one grid ---- */
          tl.fromTo("#s6-part", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 0.15);
          /* 1 — glitch-stretch entrance */
          tl.fromTo("#s6-glitch", { opacity: 0, scaleX: 1.5, transformOrigin: "left center" },
                                  { opacity: 1, scaleX: 1, duration: 0.45, ease: "power4.out" }, BEATS[0]);
          /* 2 — side snap */
          tl.fromTo("#s6-l1", { opacity: 0, x: -320 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, BEATS[1]);
          /* 3 — heavy rise with a hint of rotation */
          tl.fromTo("#s6-l2", { opacity: 0, y: 90, rotation: 4, transformOrigin: "left bottom" },
                              { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "circ.out" }, BEATS[2]);
          /* 4 — the scale + blur slam */
          tl.fromTo("#s6-l3", { opacity: 0, scale: 1.5, filter: "blur(16px)", transformOrigin: "left center" },
                              { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, BEATS[3]);
          tl.set("#s6-l3", { filter: "none" }, BEATS[3] + 0.45);
          /* the stage takes a hit on every slam */
          BEATS.forEach(function (b, i) {
            tl.fromTo(".stage", { x: 0 }, { x: i % 2 ? -5 : 5, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, b);
          });

          tl.fromTo("#s6-m1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, BEATS[3] + PULSE);
          tl.fromTo("#s6-m2", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, BEATS[3] + PULSE * 1.6);
          tl.fromTo("#s6-ro", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, GRIND - 0.1);
          /* the fill and its counter share the bar's ease so number and graphic land as one beat */
          tl.fromTo("#s6-fill", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: GRIND_DUR, ease: "power1.inOut" }, GRIND);
          var pe = document.getElementById("s6-pct"), pct = { _v: 0 };
          Object.defineProperty(pct, "v", { get: function () { return this._v; },
            set: function (x) { this._v = x; pe.textContent = Math.round(x) + "%"; } });
          tl.fromTo(pct, { v: 0 }, { v: 100, duration: GRIND_DUR, ease: "power1.inOut" }, GRIND);
          tl.fromTo("#s6-pct", { scale: 1.35, transformOrigin: "right center" }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, GRIND + GRIND_DUR);

          /* ---- handoff OUT: the whip ---- */
          tl.set("#s6-world", { filter: "blur(0px)" }, DUR - OUT);
          tl.to("#s6-world", { opacity: 0, x: -220, skewX: -6, filter: "blur(14px)", duration: OUT, ease: "power3.in" }, DUR - OUT);

          tl.to({}, { duration: DUR }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["s6-hardcore"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
