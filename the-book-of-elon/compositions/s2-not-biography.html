<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"Space Mono",monospace; color:#F2F4F8; }
        .world { position:absolute; inset:0; }
        .scrim { position:absolute; inset:0; }
        .scrim.left { background:radial-gradient(ellipse 68% 100% at 6% 50%,
                        rgba(7,8,11,.97) 12%, rgba(7,8,11,.82) 46%, rgba(7,8,11,0) 82%); }
        .stage { position:absolute; left:150px; top:0; bottom:0; width:1020px;
                 display:flex; flex-direction:column; justify-content:center; }
        .disp  { font-family:"Archivo Black",sans-serif; font-weight:400; text-transform:uppercase;
                 line-height:.96; letter-spacing:-.03em; font-size:128px; white-space:nowrap; }
        .disp span { display:inline-block; opacity:0; }
        /* the intruder block is driven as a whole — its lines are always lit */
        #s2-bot { opacity:0; }
        #s2-bot .disp span { opacity:1; }
        .flame-t { color:#FF3B1F; }
        .rule  { height:2px; background:#FF3B1F; width:100%; margin:36px 0 28px; transform-origin:left center; }
        .meta  { margin-top:30px; font-size:27px; letter-spacing:.16em; color:#79839B; line-height:1.7;
                 text-transform:uppercase; opacity:0; }
        .meta div { white-space:nowrap; }
        /* the blueprint sheet sits over the 3D slab in the right half */
        .diagram { position:absolute; left:1150px; top:180px; width:720px; height:720px; }
        .diagram svg { display:block; width:720px; height:720px; }
      </style>

      <div id="root" data-composition-id="s2-not-biography" data-start="0" data-duration="6.5"
           data-width="1920" data-height="1080">
        <div class="world" id="s2-world">
          <div class="scrim left" data-layout-ignore aria-hidden="true"></div>

          <div class="diagram" id="s2-dia" data-layout-ignore aria-hidden="true">
            <svg viewBox="0 0 720 720" fill="none">
              <defs>
                <pattern id="s2-grid" width="40" height="40" patternUnits="userSpaceOnUse" x="40" y="150">
                  <path d="M40 0H0V40" stroke="rgba(121,131,155,.32)" stroke-width="1"/>
                </pattern>
              </defs>
              <g id="s2-sheet">
                <rect x="40" y="150" width="640" height="460" fill="rgba(7,8,11,.30)" stroke="#79839B" stroke-width="2"/>
                <rect x="40" y="150" width="640" height="460" fill="url(#s2-grid)"/>
                <!-- corner marks: the sheet is a drawing, not a card -->
                <path d="M40 172V150H62 M658 150H680V172 M40 588V610H62 M658 610H680V588" stroke="#F2F4F8" stroke-width="3"/>
                <text x="64" y="186" fill="#79839B" font-family="Space Mono, monospace" font-size="18" letter-spacing="4">SHEET 01 — OPERATING MANUAL</text>
                <text x="656" y="186" text-anchor="end" fill="#79839B" font-family="Space Mono, monospace" font-size="18" letter-spacing="4">REV 04 · 1:1</text>
                <text x="64" y="588" fill="#79839B" font-family="Space Mono, monospace" font-size="18" letter-spacing="4">HIS OWN WORDS</text>
                <text x="656" y="588" text-anchor="end" fill="#FF3B1F" font-family="Space Mono, monospace" font-size="18" letter-spacing="4">FIG. 02</text>
                <!-- the schematic draws itself (mirrors the flame trace on the 3D slab) -->
                <polyline id="s2-schem" points="180,500 180,350 330,350 330,260 502,260 330,350 502,350 502,470"
                          stroke="#FF3B1F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
                <circle class="s2-node" id="s2-n1" cx="180" cy="500" r="10" fill="#FF3B1F"/>
                <circle class="s2-node" id="s2-n2" cx="502" cy="260" r="10" fill="#FF3B1F"/>
                <circle class="s2-node" id="s2-n3" cx="502" cy="470" r="10" fill="#FF3B1F"/>
                <circle class="s2-halo" id="s2-h1" cx="180" cy="500" r="10" stroke="#FF3B1F" stroke-width="2"/>
                <circle class="s2-halo" id="s2-h2" cx="502" cy="260" r="10" stroke="#FF3B1F" stroke-width="2"/>
                <circle class="s2-halo" id="s2-h3" cx="502" cy="470" r="10" stroke="#FF3B1F" stroke-width="2"/>
                <g id="s2-nlab" fill="#79839B" font-family="Space Mono, monospace" font-size="16" letter-spacing="3" opacity="0">
                  <text x="150" y="538">N-01</text>
                  <text x="524" y="254">N-02</text>
                  <text x="524" y="500">N-03</text>
                </g>
              </g>
            </svg>
          </div>

          <div class="stage">
            <div id="s2-top">
              <div class="disp"><span id="s2-l1" data-layout-allow-overlap>This is</span></div>
              <div class="disp"><span id="s2-l2">not a</span></div>
              <div class="disp"><span id="s2-l3">biography.</span></div>
            </div>
            <div class="rule" id="s2-rule"></div>
            <div id="s2-bot">
              <div class="disp"><span id="s2-l4" class="flame-t">It's the</span></div>
              <div class="disp"><span id="s2-l5" class="flame-t">manual.</span></div>
            </div>
            <div class="meta" id="s2-meta">
              <div>Five years of transcripts, tweets</div>
              <div>and interviews. His own words.</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 6.5, IN = 0.5, OUT = 0.5, P = 2.05;   /* P = the shove (global 9.05, world P2) */
          var tl = gsap.timeline({ paused: true });

          /* ---- handoff IN — rides the camera whip from s1 ---- */
          tl.fromTo("#s2-world", { opacity: 0, x: 220, skewX: 6, filter: "blur(14px)" },
                                 { opacity: 1, x: 0, skewX: 0, filter: "blur(0px)", duration: IN, ease: "power3.out" }, 0);
          tl.set("#s2-world", { filter: "none" }, IN);

          /* ---- blueprint: kinetic-type-beats — one line per beat, 3 beats ---- */
          [["#s2-l1", 0.22, 70], ["#s2-l2", 0.46, 70], ["#s2-l3", 0.7, 76]].forEach(function (w) {
            tl.set(w[0], { opacity: 1, y: w[2] }, w[1]);
            tl.to(w[0], { y: 0, duration: 0.24, ease: "power4.out" }, w[1]);
          });
          tl.fromTo("#s2-l3", { scale: 1.12, transformOrigin: "left center" }, { scale: 1, duration: 0.36, ease: "back.out(1.8)" }, 0.7);

          /* ---- rule: reactive-displacement — one driver; the intruder's spring shoves the victim ----
             The victim (THIS IS / NOT A / BIOGRAPHY.) waits 60px low; the intruder (IT'S THE / MANUAL.)
             springs up from below and the victim is displaced up 60px, completing at 45% of the driver. */
          var INTRUDER_START_Y = 560, VICTIM_FRACTION = 0.45, TILT = -7;
          var top = document.getElementById("s2-top"), bot = document.getElementById("s2-bot");
          function shove(p) {
            var vp = Math.min(1, Math.max(0, p / VICTIM_FRACTION)), q = Math.min(1, p);
            gsap.set(top, { y: 60 * (1 - vp) });
            /* travel clamps at the seat; the spring's overshoot goes into a scale pop so it never rides over the rule */
            gsap.set(bot, { y: INTRUDER_START_Y * (1 - q), rotation: TILT * (1 - q), scale: 1 + Math.max(0, p - 1) * 0.6,
                            opacity: Math.min(1, Math.max(0, p * 6)), transformOrigin: "left bottom" });
          }
          var drv = { _p: 0 };
          Object.defineProperty(drv, "p", { get: function () { return this._p; }, set: function (v) { this._p = v; shove(v); } });
          tl.fromTo(drv, { p: 0 }, { p: 1, duration: 0.9, ease: "back.out(1.5)" }, P);
          /* impact: the whole stage takes the hit for three frames */
          tl.fromTo(".stage", { x: 0 }, { x: -8, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, P + 0.16);
          tl.fromTo("#s2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power4.out" }, P + 0.3);
          tl.fromTo("#s2-meta", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, P + 0.8);

          /* ---- the blueprint sheet slides in from the right as the 3D books are shoved off ---- */
          tl.fromTo("#s2-dia", { opacity: 0, x: 640, skewX: -5 },
                               { opacity: 1, x: 0, skewX: 0, duration: 0.75, ease: "power4.out" }, P - 0.05);
          /* rule: svg-path-draw — the schematic traces itself */
          var schem = document.getElementById("s2-schem"), L = schem.getTotalLength() * 1.02;
          schem.style.strokeDasharray = L; schem.style.strokeDashoffset = L;
          tl.fromTo("#s2-schem", { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, P + 0.35);
          /* three flame nodes pop, each with a halo ring that expands and dies */
          [["#s2-n1", "#s2-h1", "180 500"], ["#s2-n2", "#s2-h2", "502 260"], ["#s2-n3", "#s2-h3", "502 470"]].forEach(function (n, i) {
            var at = P + 0.5 + i * 0.35;
            tl.fromTo(n[0], { scale: 0, svgOrigin: n[2] }, { scale: 1, duration: 0.4, ease: "back.out(2.5)" }, at);
            tl.set(n[1], { opacity: 0 }, 0);   /* halos are dark until their node pops */
            tl.fromTo(n[1], { scale: 0.6, opacity: 0.9, svgOrigin: n[2] },
                            { scale: 3.2, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, at + 0.05);
          });
          tl.fromTo("#s2-nlab", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, P + 1.5);

          /* ---- handoff OUT — the whip into s3 ---- */
          tl.set("#s2-world", { filter: "blur(0px)" }, DUR - OUT);
          tl.to("#s2-world", { opacity: 0, x: -220, skewX: -6, filter: "blur(14px)", duration: OUT, ease: "power3.in" }, DUR - OUT);

          tl.to({}, { duration: DUR }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["s2-not-biography"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
