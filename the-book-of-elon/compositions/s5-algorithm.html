<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"Space Mono",monospace; color:#F2F4F8; }
        .world { position:absolute; inset:0; }
        .scrim { position:absolute; inset:0;
                 background:radial-gradient(ellipse 68% 100% at 6% 50%,
                   rgba(7,8,11,.97) 12%, rgba(7,8,11,.82) 46%, rgba(7,8,11,0) 82%); }
        .stage { position:absolute; left:150px; top:0; bottom:0; width:1020px;
                 display:flex; flex-direction:column; justify-content:center; }
        .head  { font-family:"Archivo Black",sans-serif; font-weight:400; text-transform:uppercase;
                 line-height:.96; letter-spacing:-.03em; font-size:88px; white-space:nowrap; opacity:0; }
        .tag   { display:flex; align-items:center; gap:20px; margin-top:22px; font-size:26px; letter-spacing:.26em;
                 color:#FF3B1F; text-transform:uppercase; white-space:nowrap; opacity:0; }
        .tag i { display:block; width:56px; height:2px; background:#FF3B1F; }
        .rule  { height:2px; background:#FF3B1F; width:100%; margin:32px 0 22px; transform-origin:left center; }
        .steps { position:relative; padding-left:44px; }
        .cursor { position:absolute; left:0; top:14px; width:6px; height:56px; background:#FF3B1F; opacity:0; }
        .step  { display:flex; align-items:baseline; gap:28px; height:84px; white-space:nowrap; opacity:0; }
        .step .n { font-family:"Archivo Black",sans-serif; font-weight:400; font-size:44px; color:#FF3B1F;
                   letter-spacing:-.02em; width:78px; display:inline-block; }
        .step .t { font-size:40px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
        .foot  { margin-top:24px; font-size:27px; letter-spacing:.14em; color:#79839B; text-transform:uppercase;
                 white-space:nowrap; opacity:0; }
        .foot b { color:#FF3B1F; font-weight:400; }
        /* the bill of materials — part tags beside the 3D plate stack, one tag per plate */
        .diagram { position:absolute; left:1150px; top:0; width:770px; height:1080px; }
        .diagram svg { display:block; width:770px; height:1080px; }
        .counter { position:absolute; left:1420px; top:868px; white-space:nowrap; opacity:0; }
        .counter small { display:block; font-size:20px; letter-spacing:.24em; color:#79839B; text-transform:uppercase; margin-bottom:8px; }
        .counter b { display:block; font-weight:700; font-size:52px; letter-spacing:.04em; color:#FF3B1F;
                     font-variant-numeric:tabular-nums; line-height:1; }
      </style>

      <div id="root" data-composition-id="s5-algorithm" data-start="0" data-duration="12"
           data-width="1920" data-height="1080">
        <div class="world" id="s5-world">
          <div class="scrim" data-layout-ignore aria-hidden="true"></div>

          <div class="diagram" id="s5-dia" data-layout-ignore aria-hidden="true">
            <svg viewBox="0 0 770 1080" fill="none">
              <rect x="262" y="214" width="342" height="32" fill="rgba(7,8,11,.72)"/>
              <text id="s5-parts" x="270" y="236" fill="#79839B" font-family="Space Mono, monospace"
                    font-size="20" letter-spacing="4.8" opacity="0">ASSEMBLY · PARTS 05</text>
              <line id="s5-spine" x1="690" y1="262" x2="690" y2="818" stroke="#79839B" stroke-width="2"/>
              <g id="s5-tags"></g>
            </svg>
          </div>
          <div class="counter" id="s5-counter">
            <small>Robotics removed</small>
            <b id="s5-cnt">−$0</b>
          </div>

          <div class="stage">
            <div class="head" id="s5-head">The Algorithm</div>
            <div class="tag" id="s5-tag"><i></i>Order is non-negotiable</div>
            <div class="rule" id="s5-rule"></div>
            <div class="steps">
              <div class="cursor" id="s5-cursor"></div>
              <div class="step" id="s5-s1"><span class="n">01</span><span class="t">Question the requirements</span></div>
              <div class="step" id="s5-s2"><span class="n">02</span><span class="t">Delete the part</span></div>
              <div class="step" id="s5-s3"><span class="n">03</span><span class="t">Simplify</span></div>
              <div class="step" id="s5-s4"><span class="n">04</span><span class="t">Accelerate</span></div>
              <div class="step" id="s5-s5"><span class="n">05</span><span class="t">Automate</span></div>
            </div>
            <div class="foot" id="s5-foot">One deleted part removed <b>$2M of robotics.</b></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 12, IN = 0.5, OUT = 0.5;
          var BEAT = [1.35, 2.85, 4.75, 6.15, 7.35];   /* the five steps */
          var DEL = 3.2;                                /* global 30.7 — the 3D plate is deleted */
          var ROW = 124;                                /* screen px between plates (1.65 world units) */
          var Y = [292, 416, 540, 664, 788];            /* tag centres, one per plate */
          var tl = gsap.timeline({ paused: true });
          var cl = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
          var eInOut = function (x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
          var eOut = function (x) { return 1 - Math.pow(1 - x, 3); };

          /* ---- handoff IN: the punch-in on the drop (s4 blows out on the same window) ---- */
          tl.fromTo("#s5-world", { opacity: 0, scale: 1.18, filter: "blur(18px)", transformOrigin: "50% 50%" },
                                 { opacity: 1, scale: 1, filter: "blur(0px)", duration: IN, ease: "power4.out" }, 0);
          tl.set("#s5-world", { filter: "none" }, IN);

          /* ---- the bill of materials, laid out once at build ---- */
          var NAMES = ["STRUCTURE", "HARNESS", "MAT", "PACK", "SHELL"];
          var html = "";
          for (var i = 0; i < 5; i++) {
            var y = Y[i], inner =
              '<g id="s5-tag' + (i + 1) + 'in">' +
                '<rect x="270" y="' + (y - 30) + '" width="370" height="60" fill="rgba(7,8,11,.72)" stroke="rgba(121,131,155,.85)" stroke-width="2"/>' +
                (i === 2 ? '<rect id="s5-flash" x="270" y="' + (y - 30) + '" width="370" height="60" fill="#FF3B1F" opacity="0"/>' : "") +
                '<text x="294" y="' + (y + 9) + '" font-family="Space Mono, monospace" font-size="24" letter-spacing="3.8">' +
                  '<tspan fill="#F2F4F8">P-0' + (i + 1) + '</tspan><tspan fill="rgba(242,244,248,.78)" dx="14">' + NAMES[i] + '</tspan></text>' +
                '<line id="s5-br' + (i + 1) + '" x1="640" y1="' + y + '" x2="690" y2="' + y + '" stroke="#79839B" stroke-width="2"/>' +
                '<circle cx="690" cy="' + y + '" r="5" stroke="#F2F4F8" stroke-width="2"/>' +
                (i === 2 ? '<line id="s5-strike" x1="270" y1="' + y + '" x2="640" y2="' + y + '" stroke="#FF3B1F" stroke-width="4"/>' : "") +
              '</g>';
            if (i < 3) html += '<g id="s5-tag' + (i + 1) + '">' + inner + '</g>';
            else if (i === 3) html += '<g id="s5-below"><g id="s5-tag4">' + inner + '</g>';
            else html += '<g id="s5-tag5">' + inner + '</g></g>';
          }
          document.getElementById("s5-tags").innerHTML = html;

          /* --- blueprint: grid-card-assemble — tags cascade into their slots on the plates' own beats --- */
          tl.fromTo("#s5-parts", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.5);
          var spine = document.getElementById("s5-spine"), SL = 818 - 262;
          spine.style.strokeDasharray = SL;
          tl.fromTo(spine, { strokeDashoffset: SL }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.4);
          for (var k = 0; k < 5; k++) {
            tl.fromTo("#s5-tag" + (k + 1) + "in", { opacity: 0, x: 60 },
                                                  { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.45 + k * 0.1);
            var br = document.getElementById("s5-br" + (k + 1));
            br.style.strokeDasharray = 50;
            tl.fromTo(br, { strokeDashoffset: 50 }, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 0.7 + k * 0.1);
          }

          /* --- rule: svg-path-draw — the flame strike lands just before the plate goes --- */
          var strike = document.getElementById("s5-strike");
          strike.style.strokeDasharray = 370;
          tl.fromTo(strike, { strokeDashoffset: 370 }, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, DEL - 0.18);
          tl.fromTo("#s5-flash", { opacity: 0 }, { opacity: 0.55, duration: 0.07, yoyo: true, repeat: 1, ease: "none" }, DEL - 0.02);

          /* --- rule: anchored-layout-expand (collapse) — the deleted tag folds to zero height and the
                 tags below close the gap on the SAME curves the 3D plates use (kill, then close) --- */
          var tag3 = document.getElementById("s5-tag3"), below = document.getElementById("s5-below");
          var parts = document.getElementById("s5-parts"), cnt = document.getElementById("s5-cnt");
          var lastParts = "", lastCnt = "";
          function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
          function apply(t) {
            var pre = 1 + 0.06 * cl((t - (DEL - 0.22)) / 0.22);
            var kill = cl((t - DEL) / 0.42);
            var close = eInOut(cl((t - DEL - 0.14) / 0.62));
            gsap.set(tag3, { scaleX: pre, scaleY: Math.max(0.001, pre * (1 - kill)), opacity: 1 - kill, svgOrigin: "455 540" });
            gsap.set(below, { y: -ROW * close });
            spine.setAttribute("y2", (818 - ROW * close).toFixed(1));
            var ps = kill >= 1 ? "ASSEMBLY · PARTS 04" : "ASSEMBLY · PARTS 05";
            if (ps !== lastParts) { parts.textContent = ps; lastParts = ps; }
            var v = Math.round(2000000 * eOut(cl((t - 8.6) / 1.4)));
            var s = "−$" + fmt(v);
            if (s !== lastCnt) { cnt.textContent = s; lastCnt = s; }
          }
          /* every per-frame value is written from a property SETTER (seek() suppresses callbacks) */
          var driver = { _t: 0 };
          Object.defineProperty(driver, "t", { get: function () { return this._t; },
            set: function (v) { this._t = v; apply(v); } });
          apply(0);
          tl.to(driver, { t: DUR, duration: DUR, ease: "none" }, 0);

          /* ---- the algorithm itself ---- */
          tl.fromTo("#s5-head", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.12);
          tl.fromTo("#s5-tag", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.4);
          tl.fromTo("#s5-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: "power4.out" }, 0.45);
          ["#s5-s1", "#s5-s2", "#s5-s3", "#s5-s4", "#s5-s5"].forEach(function (s, i) {
            tl.fromTo(s, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.2, ease: "power4.out" }, BEAT[i]);
            tl.fromTo(s + " .n", { scale: 1.35, transformOrigin: "left center" }, { scale: 1, duration: 0.32, ease: "power3.out" }, BEAT[i]);
          });
          /* the flame cursor steps down the list, one row per beat */
          tl.fromTo("#s5-cursor", { opacity: 0, scaleY: 0, transformOrigin: "center top" },
                                  { opacity: 1, scaleY: 1, duration: 0.3, ease: "power3.out" }, BEAT[0]);
          [1, 2, 3, 4].forEach(function (i) {
            tl.to("#s5-cursor", { y: i * 84, duration: 0.34, ease: "power3.inOut" }, BEAT[i] - 0.06);
          });
          /* the receipt: the foot line and the counter land together */
          tl.fromTo("#s5-foot", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 8.6);
          tl.fromTo("#s5-counter", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.6);

          /* ---- handoff OUT: the whip (s6 streaks in on the same window) ---- */
          tl.set("#s5-world", { filter: "blur(0px)" }, DUR - OUT);
          tl.to("#s5-world", { opacity: 0, x: -220, skewX: -6, filter: "blur(14px)", duration: OUT, ease: "power3.in" }, DUR - OUT);

          tl.to({}, { duration: DUR }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["s5-algorithm"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
