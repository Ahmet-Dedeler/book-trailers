      <script>
        (function () {
          var DUR = 9.5;
          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#s4-head", { opacity: 0, y: 14 },
                                { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" }, 0.1);
          tl.fromTo("#s4-headrule", { scaleX: 0, transformOrigin: "left center" },
                                    { scaleX: 1, duration: 0.62, ease: "power4.out" }, 0.24);

          /* rule: waterfall-entry + spring-pop-entrance on the index numerals */
          [1,2,3].forEach(function (i) {
            var t = 0.72 + (i - 1) * 0.46;
            tl.set("#s4-r" + i, { opacity: 1, y: 46 }, t);
            tl.to("#s4-r" + i, { y: 0, duration: 0.17, ease: "power4.out" }, t);
            tl.fromTo("#s4-n" + i, { opacity: 0, scale: 0.2 },
                                   { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.6)" }, t - 0.06);
          });
          tl.fromTo("#s4-foot", { opacity: 0, y: 24 },
                                { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.45);

          /* --- rule: svg-path-draw — the licence flow assembles edge by edge --- */
          function draw(sel, at, dur) {
            var p = document.querySelector(sel), L = p.getTotalLength();
            p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
            tl.fromTo(p, { strokeDashoffset: L },
                         { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);
            return { el: p, len: L };
          }
          function pop(sel, at) {
            tl.fromTo(sel, { opacity: 0, scale: 0.72, transformOrigin: "center center" },
                           { opacity: 1, scale: 1, duration: 0.44, ease: "back.out(2)" }, at);
          }

          pop("#s4-nA", 2.15);
          var eAB = draw("#s4-eAB", 2.60, 0.60);
          tl.fromTo("#s4-lab1", { opacity: 0, scale: 1.3, transformOrigin: "left center" },
                                { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2.4)" }, 2.95);
          pop("#s4-nB", 3.30);
          tl.fromTo("#s4-lab4", { opacity: 0, y: 14 },
                                { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 3.85);

          var eBC = draw("#s4-eBC", 4.35, 0.46);
          tl.fromTo("#s4-lab2", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "none" }, 4.55);
          pop("#s4-nC", 4.72);

          var eBD = draw("#s4-eBD", 5.35, 0.50);
                    pop("#s4-nD", 5.78);

          /* --- royalties keep flowing: deterministic pulses ride the drawn edges --- */
          [[eAB, "#s4-eAB-p", 3.05], [eBC, "#s4-eBC-p", 6.25], [eBD, "#s4-eBD-p", 6.45]]
          .forEach(function (cfg) {
            var path = cfg[0], dot = document.querySelector(cfg[1]), start = cfg[2];
            var span = DUR - start, cyc = 1.5;
            var reps = Math.max(0, Math.floor(span / cyc) - 1);
            var prox = { u: 0 };
            tl.fromTo(prox, { u: 0 }, {
              u: 1, duration: cyc, ease: "none", repeat: reps,
              onUpdate: function () {
                var pt = path.el.getPointAtLength(prox.u * path.len);
                dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
                dot.setAttribute("opacity", (Math.sin(prox.u * Math.PI) * 0.95).toFixed(3));
              }
            }, start);
          });

          window.__timelines = window.__timelines || {};
          window.__timelines["s4-deal"] = tl;
        })();
      </script>
