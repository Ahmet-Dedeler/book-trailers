      <script>
        (function () {
          var DUR = 8.5, N = 16;
          var tl = gsap.timeline({ paused: true });
          var leds = [];
          for (var i = 0; i < N; i++) leds.push(document.getElementById("s3-led" + i));

          tl.fromTo("#s3-kick", { opacity: 0, y: 16 },
                                { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 0.12);

          /* rule: waterfall-entry */
          [["#s3-a1",0.55,56,.17],["#s3-a2",0.70,44,.15],["#s3-a3",0.83,32,.12],["#s3-a4",0.94,72,.19],
           ["#s3-b1",1.45,44,.15],["#s3-b2",1.58,40,.14],["#s3-b3",1.70,44,.15],["#s3-b4",1.83,60,.17]
          ].forEach(function (w) {
            tl.set(w[0], { opacity: 1, y: w[2] }, w[1]);
            tl.to(w[0], { y: 0, duration: w[3], ease: "power4.out" }, w[1]);
          });
          tl.fromTo("#s3-a4", { scale: 1.12 }, { scale: 1, duration: 0.34, ease: "back.out(2.2)" }, 0.94);

          tl.fromTo("#s3-note", { opacity: 0, y: 26 },
                                { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 2.35);

          /* --- the machine powers up --- */
          tl.fromTo("#s3-panel", { opacity: 0, y: 70 },
                                 { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 2.9);

          /* rule: svg-icon-enrichment — address LEDs run a deterministic program.
             State is a pure function of quantized timeline time, never Math.random. */
          function h(n) { var x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
          var clock = { t: 0 };
          tl.to(clock, { t: 1, duration: DUR - 2.9, ease: "none", onUpdate: function () {
            var tt = tl.time() - 2.9;
            if (tt < 0) return;
            var step = Math.floor(tt * 7);
            for (var i = 0; i < N; i++) {
              var lit;
              if (tt < 1.0) lit = (i <= tt * 18);                 /* power-on sweep */
              else lit = h(step * 31 + i * 7) > 0.52;             /* running program */
              leds[i].setAttribute("fill-opacity", lit ? "0.95" : "0.10");
              leds[i].setAttribute("stroke-opacity", lit ? "1" : "0.35");
            }
          }}, 2.9);

          /* a few toggles get thrown, on the beat */
          [[3.6,2],[3.6,5],[4.5,9],[5.4,12],[5.4,3],[6.4,7]].forEach(function (s) {
            tl.fromTo("#s3-sw" + s[1], { y: 0 }, { y: 28, duration: 0.14, ease: "power3.out" }, s[0]);
          });

          window.__timelines = window.__timelines || {};
          window.__timelines["s3-altair"] = tl;
        })();
      </script>
