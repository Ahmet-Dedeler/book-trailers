      <script>
        (function () {
          var DUR = 10, IN = 0.5, OUT = 0.5;
          var tl = gsap.timeline({ paused: true });

          /* ---- handoff IN — a head seek: s3 lifts out on the same window ---- */
          tl.fromTo("#s4-world", { opacity: 0, y: 140, filter: "blur(14px)" },
                                 { opacity: 1, y: 0, filter: "blur(0px)", duration: IN, ease: "power3.out" }, 0);
          tl.set("#s4-world", { filter: "none" }, IN);

          tl.fromTo("#s4-head", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" }, 0.5);
          tl.fromTo("#s4-headrule", { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: "power4.out" }, 0.6);

          /* --- rule: waterfall-entry + spring-pop-entrance on the index numerals --- */
          [1, 2, 3].forEach(function (i) {
            var t = 0.95 + (i - 1) * 0.42;
            tl.set("#s4-r" + i, { opacity: 1, y: 46 }, t);
            tl.to("#s4-r" + i, { y: 0, duration: 0.17, ease: "power4.out" }, t);
            tl.fromTo("#s4-n" + i, { opacity: 0, scale: 0.2, transformOrigin: "center center" },
                                   { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.6)" }, t - 0.06);
          });
          tl.fromTo("#s4-foot", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.4);

          /* --- blueprint: constellation-hub / rule: svg-path-draw — the licence flow assembles edge by edge
                 around the MICROSOFT hub; every drawn line lands on a node --- */
          function draw(sel, at, dur) {
            var p = document.querySelector(sel), L = p.getTotalLength() * 1.02;
            p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
            tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
            return { el: p, len: L };
          }
          function pop(sel, at, from) {
            tl.fromTo(sel, { opacity: 0, scale: from || 0.72, transformOrigin: "center center" },
                           { opacity: 1, scale: 1, duration: 0.44, ease: "back.out(2)" }, at);
          }

          pop("#s4-nA", 2.2);
          var eAB = draw("#s4-eAB", 2.55, 0.6);
          /* the $50,000 pops on the coin ping */
          tl.fromTo("#s4-lab1", { opacity: 0, scale: 1.35, transformOrigin: "left center" },
                                { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2.4)" }, 3.0);
          pop("#s4-nB", 3.3, 0.6);
          tl.fromTo("#s4-lab4w", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 3.85);
          tl.fromTo("#s4-lab4", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 3.85);
          var eBC = draw("#s4-eBC", 4.3, 0.45);
          tl.fromTo("#s4-lab2", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 4.5);
          pop("#s4-nC", 4.7);
          var eBD = draw("#s4-eBD", 5.2, 0.5);
          pop("#s4-nD", 5.65);
          /* the clone node fans into six unlabelled makers on a stagger */
          var fans = [];
          for (var k = 0; k < 6; k++) {
            fans.push(draw("#s4-f" + k, 6.1 + k * 0.1, 0.3));
            pop("#s4-fb" + k, 6.3 + k * 0.1, 0.5);
          }

          /* --- rule: svg-icon-enrichment — the hub breathes once the deal is signed --- */
          var gc = 0.75, gr = Math.max(0, Math.floor((DUR - OUT - 3.4) / gc) - 1);
          tl.fromTo("#s4-hubglow", { opacity: 0 }, { opacity: 0.22, duration: gc, ease: "sine.inOut", yoyo: true, repeat: gr, immediateRender: false }, 3.4);

          /* --- royalties keep flowing: deterministic pulses ride every drawn edge on a 1.5s cycle --- */
          function ride(path, dot, start) {
            var span = DUR - OUT - start, cyc = 1.5;
            var reps = Math.max(0, Math.floor(span / cyc) - 1);
            var prox = { u: 0 };
            tl.fromTo(prox, { u: 0 }, {
              u: 1, duration: cyc, ease: "none", repeat: reps, immediateRender: false,
              onUpdate: function () {
                var pt = path.el.getPointAtLength(Math.min(prox.u * path.len, path.len / 1.02));
                dot.setAttribute("cx", pt.x.toFixed(1)); dot.setAttribute("cy", pt.y.toFixed(1));
                dot.setAttribute("opacity", (Math.sin(prox.u * Math.PI) * 0.95).toFixed(3));
              }
            }, start);
          }
          ride(eAB, document.getElementById("s4-pAB"), 3.15);
          ride(eBC, document.getElementById("s4-pBC"), 5.0);
          ride(eBD, document.getElementById("s4-pBD"), 6.2);
          for (k = 0; k < 6; k++) ride(fans[k], document.getElementById("s4-pf" + k), 7.0 + k * 0.12);

          /* ---- handoff OUT: the SHUTTER — the turn against the subject. A 0.2s brightness dim, then a hard
                 0.12s cut ending exactly at DUR; s5 enters underneath through its own chromatic glitch. ---- */
          tl.fromTo("#s4-world", { filter: "brightness(1)" },
                                 { filter: "brightness(0.25)", duration: 0.2, ease: "power2.in", immediateRender: false }, DUR - 0.32);
          tl.to("#s4-world", { opacity: 0, duration: 0.12, ease: "power4.in" }, DUR - 0.12);

          window.__timelines = window.__timelines || {};
          window.__timelines["s4-deal"] = tl;
        })();
      </script>
