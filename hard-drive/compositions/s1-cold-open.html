<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"Space Mono",monospace; color:#DCE5F2; }
        .world { position:absolute; inset:0; }
        .scrim { position:absolute; left:-320px; top:20px; width:1680px; height:1040px;
                 background:radial-gradient(ellipse closest-side, rgba(5,7,14,.95),
                   rgba(5,7,14,.74) 54%, rgba(5,7,14,0) 100%); }
        .ghost { position:absolute; left:110px; bottom:-140px; font-family:"Archivo Black",sans-serif;
                 font-size:520px; line-height:1; letter-spacing:-.04em; color:rgba(220,229,242,.035);
                 white-space:nowrap; }

        .stage { position:absolute; left:168px; top:0; bottom:0; width:1180px;
                 display:flex; flex-direction:column; justify-content:center; }
        .prompt { font-size:28px; letter-spacing:.2em; color:#7C8AA3; text-transform:uppercase;
                  height:36px; white-space:nowrap; }
        .prompt b { font-weight:700; color:#DCE5F2; }
        .cursor { display:inline-block; width:17px; height:28px; background:#3B7BFF; vertical-align:-4px; margin-left:4px; }
        .rule { height:2px; background:#3B7BFF; width:620px; margin:28px 0 36px; transform-origin:left center; }
        .disp { font-family:"Archivo Black",sans-serif; font-weight:400; text-transform:uppercase;
                font-size:160px; line-height:.98; letter-spacing:-.03em; color:#DCE5F2; white-space:nowrap; }
        .w { display:inline-block; opacity:0; }
        .co { color:#3B7BFF; }

        /* ---- object: a 5.25" floppy — the story everyone knows, on the medium everyone had ---- */
        .rig { position:absolute; left:1290px; top:250px; width:580px; height:580px; perspective:1500px; }
        .disk { position:absolute; inset:0; opacity:0; }
        .disk svg { display:block; width:580px; height:580px; }
      </style>

      <div data-hf-id="hf-pw6a" id="root" data-composition-id="s1-cold-open" data-start="0" data-duration="7" data-width="1920" data-height="1080">
        <div data-hf-id="hf-66wh" class="world" id="s1-world">
          <div data-hf-id="hf-qjo2" class="ghost" id="s1-ghost" data-layout-ignore="" aria-hidden="true">1992</div>

          <div data-hf-id="hf-wh6l" class="rig" id="s1-rig">
            <div data-hf-id="hf-d5yd" class="disk" id="s1-disk">
              <svg data-hf-id="hf-pcbh" viewBox="0 0 580 580" fill="none">
                <defs data-hf-id="hf-mh0t">
                  <clippath data-hf-id="hf-x4i4" id="s1-win"><ellipse data-hf-id="hf-8lhy" cx="290" cy="356" rx="58" ry="118" /></clippath>
                  <clippath data-hf-id="hf-2xl7" id="s1-hub"><circle data-hf-id="hf-232x" cx="290" cy="356" r="86" /></clippath>
                </defs>
                <!-- sleeve -->
                <rect data-hf-id="hf-k3za" x="30" y="30" width="520" height="520" rx="14" fill="#0B1120" stroke="#3B7BFF" stroke-opacity=".9" stroke-width="3" />
                <rect data-hf-id="hf-2v74" x="46" y="46" width="488" height="488" rx="8" stroke="rgba(124,138,163,.35)" stroke-width="2" />
                <!-- write-protect notch -->
                <rect data-hf-id="hf-ki8w" x="518" y="88" width="34" height="46" fill="#05070E" stroke="#3B7BFF" stroke-opacity=".6" stroke-width="2" />
                <!-- label -->
                <rect data-hf-id="hf-2yvk" x="70" y="66" width="440" height="150" fill="rgba(220,229,242,.08)" stroke="rgba(220,229,242,.35)" stroke-width="2" />
                <text data-hf-id="hf-s53e" x="92" y="112" fill="#DCE5F2" font-family="Space Mono, monospace" font-size="24" letter-spacing="5">THE STORY</text>
                <text data-hf-id="hf-rzaf" x="92" y="150" fill="#DCE5F2" font-family="Space Mono, monospace" font-size="24" letter-spacing="5">EVERYONE KNOWS</text>
                <text data-hf-id="hf-rdzy" x="92" y="194" fill="#7C8AA3" font-family="Space Mono, monospace" font-size="17" letter-spacing="3">SIDE 1 · DS/DD · 360K</text>
                <!-- the disk itself, seen through the hub hole and the head window -->
                <g data-hf-id="hf-bf3c" id="s1-media">
                  <g data-hf-id="hf-urlv" clip-path="url(#s1-hub)">
                    <circle data-hf-id="hf-kqkv" cx="290" cy="356" r="220" fill="#111a2e" />
                    <g data-hf-id="hf-u7hn" id="s1-spokes" stroke="rgba(59,123,255,.55)" stroke-width="2" />
                    <circle data-hf-id="hf-0z7v" cx="290" cy="356" r="30" fill="#05070E" stroke="#7C8AA3" stroke-width="2" />
                    <circle data-hf-id="hf-77wn" id="s1-index" cx="290" cy="300" r="5" fill="#3B7BFF" />
                  </g>
                  <g data-hf-id="hf-seaq" clip-path="url(#s1-win)">
                    <circle data-hf-id="hf-kn8v" cx="290" cy="356" r="220" fill="#111a2e" />
                    <g data-hf-id="hf-b9u1" id="s1-spokes2" stroke="rgba(59,123,255,.35)" stroke-width="2" />
                  </g>
                </g>
                <circle data-hf-id="hf-uuew" cx="290" cy="356" r="86" stroke="#3B7BFF" stroke-opacity=".7" stroke-width="3" />
                <ellipse data-hf-id="hf-8rvg" cx="290" cy="356" rx="58" ry="118" stroke="#3B7BFF" stroke-opacity=".5" stroke-width="2" />
                <!-- head window rim highlight -->
                <rect data-hf-id="hf-j1ra" x="30" y="500" width="520" height="50" fill="rgba(59,123,255,.05)" />
                <text data-hf-id="hf-ic53" x="290" y="532" text-anchor="middle" fill="#7C8AA3" font-family="Space Mono, monospace" font-size="15" letter-spacing="4">5.25 IN · SOFT SECTORED</text>
              </svg>
            </div>
          </div>

          <div data-hf-id="hf-edqo" class="scrim" data-layout-ignore="" aria-hidden="true"></div>

          <div data-hf-id="hf-tan6" class="stage">
            <div data-hf-id="hf-3k5u" class="prompt"><b data-hf-id="hf-ec2e">C:\&gt;</b> <span data-hf-id="hf-xajh" id="s1-typed"></span><span data-hf-id="hf-uls8" class="cursor" id="s1-cursor"></span></div>
            <div data-hf-id="hf-dgpv" class="rule" id="s1-rule"></div>
            <div data-hf-id="hf-nwlw" class="disp"><span data-hf-id="hf-tt0f" class="w" id="s1-l1">Everyone</span></div>
            <div data-hf-id="hf-9gq4" class="disp"><span data-hf-id="hf-57mz" class="w" id="s1-l2">knows</span> <span data-hf-id="hf-0p2i" class="w" id="s1-l3">how</span></div>
            <div data-hf-id="hf-89t1" class="disp"><span data-hf-id="hf-kcsz" class="w co" id="s1-l4">Microsoft</span></div>
            <div data-hf-id="hf-8o42" class="disp"><span data-hf-id="hf-ueto" class="w" id="s1-l5">won.</span></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 7, OUT = 0.5;
          var tl = gsap.timeline({ paused: true });

          /* ---- scene 1 opens from black on its own terms (no IN handoff) ---- */
          tl.fromTo("#s1-world", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0);

          /* spokes on the disk media, laid out once at build */
          function spokes(id, n, r0, r1) {
            var g = document.getElementById(id), h = "";
            for (var i = 0; i < n; i++) {
              var a = i / n * Math.PI * 2;
              h += '<line x1="' + (290 + Math.cos(a) * r0).toFixed(1) + '" y1="' + (356 + Math.sin(a) * r0).toFixed(1) +
                   '" x2="' + (290 + Math.cos(a) * r1).toFixed(1) + '" y2="' + (356 + Math.sin(a) * r1).toFixed(1) + '"/>';
            }
            g.innerHTML = h;
          }
          spokes("s1-spokes", 24, 34, 86); spokes("s1-spokes2", 48, 90, 220);

          /* --- rule: discrete-text-sequence — the DOS prompt types the dateline, seek-safe --- */
          var LINE = "SEATTLE, WASHINGTON 1992";
          var typed = document.getElementById("s1-typed");
          var cursor = document.getElementById("s1-cursor");
          var typer = { i: 0 };
          tl.fromTo(typer, { i: 0 }, {
            i: LINE.length, duration: 1.3, ease: "none",
            onUpdate: function () { typed.textContent = LINE.slice(0, Math.round(typer.i)); }
          }, 0.4);
          /* --- rule: context-sensitive-cursor — block cursor, square-wave blink off tl.time() --- */
          var clock = { t: 0 };
          tl.to(clock, {
            t: DUR, duration: DUR, ease: "none",
            onUpdate: function () {
              var tt = tl.time();
              cursor.style.opacity = tt < 0.3 ? 0 : (((tt % 0.8) < 0.45) ? 1 : 0.1);
            }
          }, 0);
          tl.fromTo("#s1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.out" }, 1.75);

          /* --- rule: waterfall-entry — the received story, one line per beat --- */
          var wave = [["#s1-l1", 2.05, 70, 0.22], ["#s1-l2", 2.38, 60, 0.2], ["#s1-l3", 2.5, 50, 0.18],
                      ["#s1-l4", 2.82, 80, 0.24], ["#s1-l5", 3.22, 60, 0.2]];
          wave.forEach(function (w) {
            tl.set(w[0], { opacity: 1, y: w[2] }, w[1]);
            tl.to(w[0], { y: 0, duration: w[3], ease: "power4.out" }, w[1]);
          });
          tl.fromTo("#s1-l4", { scale: 1.18, transformOrigin: "left center" }, { scale: 1, duration: 0.38, ease: "back.out(2)" }, 2.82);

          /* --- object: the floppy slides in, its media spins at 300 rpm, the index hole flashes --- */
          tl.fromTo("#s1-disk", { opacity: 0, x: 140, rotationY: 26, rotationX: 6 },
                                { opacity: 1, x: 0, rotationY: -8, rotationX: 3, duration: 0.8, ease: "power4.out" }, 0.55);
          var oc = 3.2, orp = Math.max(0, Math.floor((DUR - 1.4) / oc) - 1);
          tl.to("#s1-disk", { rotationY: 4, y: -12, duration: oc, ease: "sine.inOut", yoyo: true, repeat: orp }, 1.4);
          /* svgOrigin pins the spin to the real hub centre */
          tl.fromTo("#s1-media", { rotation: 0, svgOrigin: "290 356" }, { rotation: 1800, duration: DUR - 0.6, ease: "none" }, 0.6);
          /* the index hole passes the sensor once per revolution: a cobalt flash */
          var indexEl = document.getElementById("s1-index"), iclock = { t: 0 };
          tl.to(iclock, { t: 1, duration: DUR, ease: "none", onUpdate: function () {
            var tt = tl.time() - 0.6; if (tt < 0) { indexEl.setAttribute("opacity", 0.3); return; }
            var ph = (tt * 1800 / (DUR - 0.6)) % 360;
            indexEl.setAttribute("opacity", ph < 40 ? "1" : "0.3");
            indexEl.setAttribute("r", ph < 40 ? "8" : "5");
          }}, 0);
          tl.fromTo("#s1-ghost", { x: 0 }, { x: -50, duration: DUR, ease: "none" }, 0);

          /* ---- handoff OUT: the head seeks — this scene lifts out, s2 rises in on the same window ---- */
          tl.set("#s1-world", { filter: "blur(0px)" }, DUR - OUT);
          tl.to("#s1-world", { opacity: 0, y: -140, filter: "blur(14px)", duration: OUT, ease: "power3.in" }, DUR - OUT);

          window.__timelines = window.__timelines || {};
          window.__timelines["s1-cold-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
