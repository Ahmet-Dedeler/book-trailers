<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"IBM Plex Mono",monospace; color:#EFE7D6; }
        .world { position:absolute; inset:0; }
        .veil  { position:absolute; inset:0; background:rgba(11,10,9,.40); }
        .scrim { position:absolute; left:-300px; top:40px; width:1660px; height:1000px;
                 background:radial-gradient(ellipse closest-side, rgba(11,10,9,.95),
                   rgba(11,10,9,.76) 56%, rgba(11,10,9,0) 100%); }

        /* ---- type block on the left rail ---- */
        .stage { position:absolute; left:168px; top:0; bottom:0; width:1180px; padding-top:112px;
                 display:flex; flex-direction:column; justify-content:flex-start; align-items:flex-start; }
        .kicker { display:block; height:34px; font-size:27px; letter-spacing:.24em; color:#9A8F7C;
                  text-transform:uppercase; white-space:nowrap; opacity:0; }
        .kicker .lc { text-transform:none; }
        .rule { height:2px; width:560px; background:#F0761E; margin:22px 0 42px; }
        .disp { font-family:"League Gothic",sans-serif; font-weight:400; text-transform:uppercase;
                font-size:178px; line-height:.92; letter-spacing:-.02em; color:#EFE7D6; white-space:nowrap; }
        .w { display:inline-block; opacity:0; }
        .amber { color:#F0761E; }

        /* ---- the paper slip: the line, typed as the reporter would have typed it ---- */
        .slip { position:absolute; left:0; top:748px; width:760px; padding:34px 40px 30px; background:#E9DFC8; color:#1A1611;
                box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.35) inset; opacity:0; }
        .slip-t { font-family:"IBM Plex Mono",monospace; font-size:33px; line-height:1.42; letter-spacing:.02em;
                  white-space:nowrap; height:47px; }
        .slip-c { display:inline-block; width:16px; height:32px; background:#F0761E; vertical-align:-6px; margin-left:4px; }
        .slip-a { margin-top:18px; font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:#6B6152;
                  white-space:nowrap; opacity:0; }
        .slip::after { content:""; position:absolute; left:0; right:0; top:0; height:6px; background:#F0761E; }

        /* ---- object: the micro-cassette recorder that was in the room ---- */
        .rig { position:absolute; left:1300px; top:320px; width:560px; height:400px;
               perspective:1600px; perspective-origin:50% 50%; }
        .deck { position:absolute; left:0; top:12px; width:560px; height:368px; opacity:0; transform-style:preserve-3d; }
        .deck svg { display:block; width:560px; height:368px; }
        .deck .lbl { font-family:"IBM Plex Mono",monospace; }
        .deckshadow { position:absolute; left:20px; right:20px; bottom:-26px; height:44px;
                      background:radial-gradient(ellipse closest-side, rgba(0,0,0,.72), rgba(0,0,0,0)); }
      </style>

      <div id="root" data-composition-id="s3-access" data-start="0" data-duration="9"
           data-width="1920" data-height="1080">
        <div class="world" id="s3-world">
          <div class="veil" data-layout-ignore aria-hidden="true"></div>

          <div class="rig" id="s3-rig">
            <div class="deck" id="s3-deck">
              <div class="deckshadow" data-layout-ignore aria-hidden="true"></div>
              <svg viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- body -->
                <rect x="6" y="6" width="628" height="408" rx="24" fill="#16130F" stroke="rgba(239,231,214,.42)" stroke-width="3"/>
                <rect x="17" y="17" width="606" height="386" rx="18" stroke="rgba(239,231,214,.08)" stroke-width="2"/>
                <!-- grip ridges down the left edge -->
                <g stroke="rgba(239,231,214,.10)" stroke-width="2">
                  <line x1="24" y1="160" x2="24" y2="330"/><line x1="29" y1="160" x2="29" y2="330"/>
                </g>
                <!-- cream label -->
                <rect x="36" y="32" width="400" height="100" rx="4" fill="#E9DFC8"/>
                <rect x="36" y="32" width="400" height="6" fill="#F0761E"/>
                <text class="lbl" x="56" y="80" fill="#1A1611" font-size="28" font-weight="700" letter-spacing="4">MORITZ / APPLE</text>
                <text class="lbl" x="56" y="114" fill="#6B6152" font-size="22" letter-spacing="3">SIDE A — 90 MIN</text>
                <!-- REC lamp -->
                <circle id="s3-recring" cx="500" cy="62" r="20" stroke="#E03A3E" stroke-width="2" opacity=".5"/>
                <circle id="s3-rec" cx="500" cy="62" r="12" fill="#E03A3E"/>
                <text class="lbl" x="530" y="70" fill="#9A8F7C" font-size="22" letter-spacing="3">REC</text>
                <!-- mic grille -->
                <g fill="rgba(239,231,214,.22)">
                  <circle cx="470" cy="104" r="3"/><circle cx="486" cy="104" r="3"/><circle cx="502" cy="104" r="3"/><circle cx="518" cy="104" r="3"/><circle cx="534" cy="104" r="3"/><circle cx="550" cy="104" r="3"/><circle cx="566" cy="104" r="3"/><circle cx="582" cy="104" r="3"/><circle cx="598" cy="104" r="3"/>
                  <circle cx="478" cy="118" r="3"/><circle cx="494" cy="118" r="3"/><circle cx="510" cy="118" r="3"/><circle cx="526" cy="118" r="3"/><circle cx="542" cy="118" r="3"/><circle cx="558" cy="118" r="3"/><circle cx="574" cy="118" r="3"/><circle cx="590" cy="118" r="3"/>
                  <circle cx="470" cy="132" r="3"/><circle cx="486" cy="132" r="3"/><circle cx="502" cy="132" r="3"/><circle cx="518" cy="132" r="3"/><circle cx="534" cy="132" r="3"/><circle cx="550" cy="132" r="3"/><circle cx="566" cy="132" r="3"/><circle cx="582" cy="132" r="3"/><circle cx="598" cy="132" r="3"/>
                </g>
                <!-- cassette window -->
                <rect x="36" y="150" width="470" height="172" rx="12" fill="rgba(11,10,9,.74)" stroke="rgba(239,231,214,.28)" stroke-width="2.5"/>
                <rect x="48" y="162" width="446" height="148" rx="8" stroke="rgba(239,231,214,.10)" stroke-width="1.5"/>
                <!-- tape packs: supply (left) shrinks, take-up (right) grows -->
                <circle id="s3-packL" cx="150" cy="235" r="64" fill="rgba(239,231,214,.12)" stroke="rgba(239,231,214,.34)" stroke-width="5"/>
                <circle id="s3-packR" cx="390" cy="235" r="30" fill="rgba(239,231,214,.12)" stroke="rgba(239,231,214,.34)" stroke-width="5"/>
                <!-- the visible run of tape between them -->
                <path id="s3-tape" d="M150 299 L215 305 L325 305 L390 265" stroke="rgba(239,231,214,.62)" stroke-width="4" stroke-linejoin="round"/>
                <path id="s3-tapeflow" d="M150 299 L215 305 L325 305 L390 265" stroke="rgba(240,118,30,.75)" stroke-width="2" stroke-dasharray="10 14" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- guide rollers -->
                <g id="s3-rollL"><circle cx="215" cy="305" r="8" fill="#16130F" stroke="#F0761E" stroke-width="2.5"/><line x1="215" y1="298" x2="215" y2="312" stroke="#F0761E" stroke-width="2"/></g>
                <g id="s3-rollR"><circle cx="325" cy="305" r="8" fill="#16130F" stroke="#F0761E" stroke-width="2.5"/><line x1="325" y1="298" x2="325" y2="312" stroke="#F0761E" stroke-width="2"/></g>
                <!-- hubs with six teeth -->
                <g id="s3-hubL" stroke="#F0761E" stroke-width="3" stroke-linecap="round">
                  <circle cx="150" cy="235" r="22" fill="#0B0A09"/>
                  <line x1="172" y1="235" x2="180" y2="235"/><line x1="161" y1="254" x2="165" y2="261"/><line x1="139" y1="254" x2="135" y2="261"/>
                  <line x1="128" y1="235" x2="120" y2="235"/><line x1="139" y1="216" x2="135" y2="209"/><line x1="161" y1="216" x2="165" y2="209"/>
                </g>
                <g id="s3-hubR" stroke="#F0761E" stroke-width="3" stroke-linecap="round">
                  <circle cx="390" cy="235" r="22" fill="#0B0A09"/>
                  <line x1="412" y1="235" x2="420" y2="235"/><line x1="401" y1="254" x2="405" y2="261"/><line x1="379" y1="254" x2="375" y2="261"/>
                  <line x1="368" y1="235" x2="360" y2="235"/><line x1="379" y1="216" x2="375" y2="209"/><line x1="401" y1="216" x2="405" y2="209"/>
                </g>
                <!-- VU meter -->
                <rect x="516" y="150" width="108" height="112" rx="8" fill="rgba(11,10,9,.74)" stroke="rgba(239,231,214,.28)" stroke-width="2.5"/>
                <path d="M520.5 196.5 A70 70 0 0 1 619.5 196.5" stroke="rgba(239,231,214,.45)" stroke-width="3"/>
                <path d="M594 180 A70 70 0 0 1 619.5 196.5" stroke="#E03A3E" stroke-width="4"/>
                <g stroke="rgba(239,231,214,.45)" stroke-width="2">
                  <line x1="520.5" y1="196.5" x2="526" y2="202"/><line x1="545" y1="179" x2="548" y2="186"/><line x1="570" y1="176" x2="570" y2="184"/><line x1="595" y1="179" x2="592" y2="186"/>
                </g>
                <text class="lbl" x="528" y="256" fill="#9A8F7C" font-size="22" letter-spacing="2">VU</text>
                <line id="s3-needle" x1="570" y1="246" x2="570" y2="174" stroke="#EFE7D6" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="570" cy="246" r="5" fill="#F0761E"/>
                <!-- mechanical counter -->
                <rect x="516" y="278" width="108" height="44" rx="4" fill="#0B0A09" stroke="rgba(239,231,214,.3)" stroke-width="2"/>
                <line x1="552" y1="282" x2="552" y2="318" stroke="rgba(239,231,214,.12)" stroke-width="1.5"/>
                <line x1="588" y1="282" x2="588" y2="318" stroke="rgba(239,231,214,.12)" stroke-width="1.5"/>
                <text class="lbl" id="s3-ctr" x="570" y="309" text-anchor="middle" fill="#F0761E" font-size="26" letter-spacing="14">000</text>
                <!-- transport keys: REW · PLAY (down) · FF · STOP · REC -->
                <g stroke="rgba(239,231,214,.25)" stroke-width="2" fill="#221B14">
                  <rect x="36" y="342" width="88" height="56" rx="6"/>
                  <rect x="236" y="342" width="88" height="56" rx="6"/>
                  <rect x="336" y="342" width="88" height="56" rx="6"/>
                  <rect x="436" y="342" width="88" height="56" rx="6"/>
                </g>
                <rect x="136" y="346" width="88" height="52" rx="6" fill="#F0761E"/>
                <g fill="rgba(239,231,214,.7)">
                  <path d="M80 358 L62 370 L80 382 Z"/><path d="M100 358 L82 370 L100 382 Z"/>
                  <path d="M262 358 L280 370 L262 382 Z"/><path d="M282 358 L300 370 L282 382 Z"/>
                  <rect x="368" y="358" width="24" height="24"/>
                </g>
                <path d="M170 360 L192 372 L170 384 Z" fill="#0B0A09"/>
                <circle cx="480" cy="370" r="11" fill="#E03A3E"/>
                <!-- speaker grille bottom right -->
                <g fill="rgba(239,231,214,.18)">
                  <circle cx="548" cy="352" r="3"/><circle cx="564" cy="352" r="3"/><circle cx="580" cy="352" r="3"/><circle cx="596" cy="352" r="3"/>
                  <circle cx="556" cy="366" r="3"/><circle cx="572" cy="366" r="3"/><circle cx="588" cy="366" r="3"/>
                  <circle cx="548" cy="380" r="3"/><circle cx="564" cy="380" r="3"/><circle cx="580" cy="380" r="3"/><circle cx="596" cy="380" r="3"/>
                </g>
              </svg>
            </div>
          </div>

          <div class="scrim" data-layout-ignore aria-hidden="true"></div>

          <div class="stage" id="s3-stage">
            <div class="kicker" id="s3-kick">Early 1980<span class="lc">s</span> &nbsp;·&nbsp; Cupertino, California</div>
            <div class="rule" id="s3-rule"></div>
            <div class="disp">
              <span class="w" id="s3-a1">Jobs</span> <span class="w" id="s3-a2">hired</span>
              <span class="w" id="s3-a3">a</span> <span class="w" id="s3-a4">Time</span>
            </div>
            <div class="disp">
              <span class="w" id="s3-b1">reporter</span> <span class="w" id="s3-b2">to</span>
              <span class="w" id="s3-b3">document</span>
            </div>
            <div class="disp">
              <span class="w" id="s3-c1">the</span> <span class="w amber" id="s3-c2">Macintosh.</span>
            </div>
            <div class="slip" id="s3-slip">
              <div class="slip-t"><span id="s3-qt"></span><span class="slip-c" id="s3-qc"></span></div>
              <div class="slip-a" id="s3-qa">— Steve Jobs, as recalled by Andy Hertzfeld</div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 9, IN = 0.5, OUT = 0.5;
          var tl = gsap.timeline({ paused: true });

          /* ---- handoff IN: scene 2 is streaking out at the same wall time ---- */
          tl.fromTo("#s3-world", { opacity: 0, x: 160, filter: "blur(16px)" },
                                 { opacity: 1, x: 0, filter: "blur(0px)", duration: IN, ease: "power3.out" }, 0);
          tl.set("#s3-world", { filter: "none" }, IN);

          /* ---- kicker + rule ---- */
          tl.fromTo("#s3-kick", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo("#s3-rule", { scaleX: 0, transformOrigin: "left center" },
                                { scaleX: 1, duration: 0.6, ease: "power4.out" }, 0.45);

          /* ---- blueprint kinetic-type-beats, rule waterfall-entry: binary opacity, whip from below ---- */
          var wave = [
            ["#s3-a1", 0.62, 66, 0.19], ["#s3-a2", 0.77, 50, 0.16], ["#s3-a3", 0.91, 36, 0.12], ["#s3-a4", 1.02, 60, 0.17],
            ["#s3-b1", 1.34, 72, 0.19], ["#s3-b2", 1.51, 36, 0.12], ["#s3-b3", 1.62, 60, 0.17],
            ["#s3-c1", 1.96, 40, 0.13], ["#s3-c2", 2.08, 84, 0.21]
          ];
          wave.forEach(function (w) {
            tl.set(w[0], { opacity: 1, y: w[2] }, w[1]);
            tl.to(w[0], { y: 0, duration: w[3], ease: "power4.out" }, w[1]);
          });
          /* the accent word slams — the payoff of the line */
          tl.fromTo("#s3-c2", { scale: 1.3, filter: "blur(10px)", transformOrigin: "0% 50%" },
                              { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, 2.08);
          tl.set("#s3-c2", { filter: "none" }, 2.5);

          /* ---- object: the deck arrives on a rotateY 34 → -12 orbit, then idles on a sine loop ---- */
          tl.fromTo("#s3-deck", { opacity: 0, rotationY: 34, rotationX: 12, z: -240, y: 46 },
                                { opacity: 1, rotationY: -12, rotationX: 6, z: 0, y: 0, duration: 0.9, ease: "power4.out" }, 0.38);
          var dc = 3.2, dr = Math.max(0, Math.floor((DUR - OUT - 1.3) / dc) - 1);
          tl.to("#s3-deck", { rotationY: -4, rotationX: 3, y: -12, duration: dc, ease: "sine.inOut", yoyo: true, repeat: dr }, 1.3);

          /* ---- rule svg-icon-enrichment: every moving part reads off the timeline clock ---- */
          var packL = document.getElementById("s3-packL"), packR = document.getElementById("s3-packR");
          var tape = document.getElementById("s3-tape"), flow = document.getElementById("s3-tapeflow");
          var hubL = document.getElementById("s3-hubL"), hubR = document.getElementById("s3-hubR");
          var rollL = document.getElementById("s3-rollL"), rollR = document.getElementById("s3-rollR");
          var rec = document.getElementById("s3-rec"), recring = document.getElementById("s3-recring");
          var needle = document.getElementById("s3-needle"), ctr = document.getElementById("s3-ctr");
          var caret = document.getElementById("s3-qc");
          var ROLL = 0.9, RUN = DUR - ROLL;           /* tape starts rolling once the deck has landed */
          var K = 720 * 34 / Math.log(64 / 30);       /* both hubs make two turns over the run, at different rates */
          function hash(n) { var h = Math.imul(n ^ 0x9E3779B9, 0x85EBCA6B) >>> 0; h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
          function setTape(p) {
            var rL = 64 - 34 * p, rR = 30 + 34 * p;
            packL.setAttribute("r", rL.toFixed(2)); packR.setAttribute("r", rR.toFixed(2));
            var d = "M150 " + (235 + rL).toFixed(1) + " L215 305 L325 305 L390 " + (235 + rR).toFixed(1);
            tape.setAttribute("d", d); flow.setAttribute("d", d);
            flow.style.strokeDashoffset = String(-(p * 960).toFixed(1));               /* 960 = 40 dash periods */
            var aL = (K / 34) * Math.log(64 / (64 - 34 * p)), aR = (K / 34) * Math.log((30 + 34 * p) / 30);
            hubL.setAttribute("transform", "rotate(" + aL.toFixed(2) + " 150 235)");
            hubR.setAttribute("transform", "rotate(" + aR.toFixed(2) + " 390 235)");
            rollL.setAttribute("transform", "rotate(" + (p * 1800).toFixed(1) + " 215 305)");
            rollR.setAttribute("transform", "rotate(" + (p * 1800).toFixed(1) + " 325 305)");
          }
          setTape(0);
          var clock = { t: 0 };
          tl.to(clock, {
            t: DUR, duration: DUR, ease: "none",
            onUpdate: function () {
              var t = tl.time();
              var p = Math.max(0, Math.min(1, (t - ROLL) / RUN));
              setTape(p);
              /* REC lamp beats at 0.85s */
              var ph = ((t / 0.85) % 1) * Math.PI * 2;
              rec.style.opacity = String((0.55 + 0.45 * Math.sin(ph)).toFixed(3));
              recring.setAttribute("transform", "translate(500 62) scale(" + (1 + 0.08 * Math.sin(ph + Math.PI / 2)).toFixed(3) + ") translate(-500 -62)");
              recring.style.opacity = String((0.35 + 0.3 * Math.sin(ph)).toFixed(3));
              /* VU needle wobbles on a hash of floor(t*18), smoothed between steps */
              var n = Math.floor(t * 18), f = t * 18 - n, s = f * f * (3 - 2 * f);
              var v = hash(n) * (1 - s) + hash(n + 1) * s;
              var live = p > 0 ? 1 : 0;
              needle.setAttribute("transform", "rotate(" + (-44 + live * (14 + 62 * v)).toFixed(2) + " 570 246)");
              /* three-digit counter, 27 counts per second once rolling */
              ctr.textContent = String(Math.min(999, Math.max(0, Math.floor((t - ROLL) * 27)))).padStart(3, "0");
              /* the slip's caret: square-wave blink, hidden until the typing starts */
              caret.style.opacity = (t < 3.8) ? 0 : (((t % 0.86) < 0.47) ? 1 : 0.12);
            }
          }, 0);

          /* ---- the slip: the line arrives and types itself (rule discrete-text-sequence, smooth slice) ---- */
          tl.fromTo("#s3-slip", { rotation: -3, y: 60, opacity: 0 },
                                { rotation: -1.2, y: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, 3.4);
          var QUOTE = "\"Mike's going to be our historian.\"";
          var qt = document.getElementById("s3-qt"), typer = { i: 0 };
          tl.fromTo(typer, { i: 0 }, {
            i: QUOTE.length, duration: 1.45, ease: "none",
            onUpdate: function () { qt.textContent = QUOTE.slice(0, Math.round(typer.i)); }
          }, 3.8);
          tl.fromTo("#s3-qa", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.4);

          /* ---- handoff OUT: lateral page-push (s4 streaks in at the same wall time) ---- */
          tl.set("#s3-world", { filter: "blur(0px)" }, DUR - OUT);
          tl.to("#s3-world", { opacity: 0, x: -160, filter: "blur(16px)", duration: OUT, ease: "power3.in" }, DUR - OUT);

          window.__timelines = window.__timelines || {};
          window.__timelines["s3-access"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
