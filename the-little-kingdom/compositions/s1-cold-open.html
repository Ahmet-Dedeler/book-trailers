<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"IBM Plex Mono",monospace; color:#EFE7D6; }
        .world { position:absolute; inset:0; }
        .veil  { position:absolute; inset:0; background:rgba(11,10,9,.40); }
        .scrim { position:absolute; left:-300px; top:60px; width:1640px; height:960px;
                 background:radial-gradient(ellipse closest-side, rgba(11,10,9,.95),
                   rgba(11,10,9,.76) 54%, rgba(11,10,9,0) 100%); }
        .ghost { position:absolute; left:120px; bottom:-150px; font-family:"League Gothic",sans-serif;
                 font-size:640px; line-height:1; letter-spacing:-.02em; color:rgba(239,231,214,.045);
                 white-space:nowrap; }

        /* ---- type block on the left rail ---- */
        .stage { position:absolute; left:168px; top:0; bottom:0; width:1180px;
                 display:flex; flex-direction:column; justify-content:center; }
        .kicker { font-size:27px; letter-spacing:.24em; color:#9A8F7C; text-transform:uppercase;
                  display:block; height:34px; white-space:nowrap; }
        .caret { display:inline-block; width:15px; height:27px; background:#F0761E;
                 vertical-align:-4px; margin-left:6px; }
        .rule { height:2px; background:#F0761E; width:560px; margin:30px 0 40px; }
        .disp { font-family:"League Gothic",sans-serif; font-weight:400; text-transform:uppercase;
                font-size:178px; line-height:.92; letter-spacing:-.02em; color:#EFE7D6; white-space:nowrap; }
        .w { display:inline-block; opacity:0; }
        .amber { color:#F0761E; }

        /* ---- object: the Apple shelf — six real volumes with printed spines ---- */
        .rig { position:absolute; left:1300px; top:230px; width:560px; height:640px;
               perspective:1500px; perspective-origin:50% 18%; }
        .shelf { position:absolute; inset:0; transform-style:preserve-3d; }
        .vol { position:absolute; bottom:40px; width:76px; transform-style:preserve-3d; opacity:0; }
        .sp { position:absolute; left:0; top:0; width:76px; height:100%;
              background:linear-gradient(100deg,#2A2118 0%,#181310 55%,#221B14 100%);
              border:2px solid rgba(239,231,214,.34); border-bottom:none; border-radius:3px 3px 0 0;
              box-shadow: inset 0 0 0 1px rgba(240,118,30,.10); }
        .sp i { position:absolute; left:12px; right:12px; top:40px; height:3px; background:#F0761E; opacity:.75; display:block; }
        .sp u { position:absolute; left:12px; right:12px; bottom:36px; height:3px; background:rgba(239,231,214,.28); display:block; }
        .sp span { position:absolute; left:50%; top:66px; transform:translateX(-50%);
                   writing-mode:vertical-rl; text-orientation:mixed; font-size:18px; letter-spacing:.24em;
                   color:rgba(239,231,214,.78); text-transform:uppercase; white-space:nowrap; }
        .hd { position:absolute; left:0; top:0; width:76px; height:46px; transform-origin:center top;
              transform:rotateX(90deg);
              background:repeating-linear-gradient(to right,#CFC6B2 0 2px,#9E9683 2px 4px); }
        .shelfline { position:absolute; left:-10px; bottom:34px; width:580px; height:5px;
                     background:#F0761E; transform-origin:left center;
                     box-shadow:0 8px 24px rgba(240,118,30,.35); }
        .shelfshadow { position:absolute; left:-10px; bottom:0; width:580px; height:30px;
                       background:radial-gradient(ellipse closest-side, rgba(0,0,0,.7), rgba(0,0,0,0)); }
        .shelftag { position:absolute; left:-10px; bottom:-18px; font-size:20px; letter-spacing:.22em;
                    color:#EFE7D6; background:rgba(11,10,9,.88); padding:7px 14px; text-transform:uppercase;
                    opacity:0; white-space:nowrap; }
      </style>

      <div id="root" data-composition-id="s1-cold-open" data-start="0" data-duration="7"
           data-width="1920" data-height="1080">
        <div class="world" id="s1-world">
          <div class="veil" data-layout-ignore aria-hidden="true"></div>
          <div class="ghost" id="s1-ghost" data-layout-ignore aria-hidden="true">1981</div>

          <div class="rig" id="s1-rig">
            <div class="shelf" id="s1-shelf">
              <div class="shelfshadow" data-layout-ignore aria-hidden="true"></div>
              <div class="vol" id="s1-v1" style="left:0;    height:430px"><div class="hd"></div><div class="sp"><i></i><span>Apple</span><u></u></div></div>
              <div class="vol" id="s1-v2" style="left:92px; height:472px"><div class="hd"></div><div class="sp"><i></i><span>Jobs</span><u></u></div></div>
              <div class="vol" id="s1-v3" style="left:184px;height:404px"><div class="hd"></div><div class="sp"><i></i><span>The Mac</span><u></u></div></div>
              <div class="vol" id="s1-v4" style="left:276px;height:456px"><div class="hd"></div><div class="sp"><i></i><span>1984</span><u></u></div></div>
              <div class="vol" id="s1-v5" style="left:368px;height:418px"><div class="hd"></div><div class="sp"><i></i><span>Insanely</span><u></u></div></div>
              <div class="vol" id="s1-v6" style="left:460px;height:444px"><div class="hd"></div><div class="sp"><i></i><span>The Rise</span><u></u></div></div>
              <div class="shelfline" id="s1-shelfline"></div>
              <div class="shelftag" id="s1-shelftag">The Apple shelf</div>
            </div>
          </div>

          <div class="scrim" data-layout-ignore aria-hidden="true"></div>

          <div class="stage" id="s1-stage">
            <div class="kicker"><span id="s1-kick"></span><span class="caret" id="s1-caret"></span></div>
            <div class="rule" id="s1-rule"></div>
            <div class="disp">
              <span class="w" id="s1-a1">Every</span> <span class="w" id="s1-a2">story</span>
            </div>
            <div class="disp">
              <span class="w" id="s1-a3">about</span> <span class="w" id="s1-a4">Apple</span>
              <span class="w" id="s1-a5">was</span>
            </div>
            <div class="disp">
              <span class="w" id="s1-b1">written</span> <span class="w amber" id="s1-b2">after</span>
              <span class="w" id="s1-b3">it</span> <span class="w" id="s1-b4">won.</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 7, OUT = 0.5;
          var tl = gsap.timeline({ paused: true });

          /* ---- scene 1 opens from black on its own terms (no IN handoff) ---- */
          tl.fromTo("#s1-world", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

          /* --- rule: discrete-text-sequence — the dateline types on a proxy, seek-safe --- */
          var KICK = "Cupertino, California — 1981";
          var kickEl = document.getElementById("s1-kick");
          var caret = document.getElementById("s1-caret");
          var typer = { i: 0 };
          tl.fromTo(typer, { i: 0 }, {
            i: KICK.length, duration: 1.5, ease: "none",
            onUpdate: function () { kickEl.textContent = KICK.slice(0, Math.round(typer.i)); }
          }, 0.35);

          /* --- rule: context-sensitive-cursor — square-wave blink from tl.time() --- */
          var clock = { t: 0 };
          tl.to(clock, {
            t: DUR, duration: DUR, ease: "none",
            onUpdate: function () {
              var tt = tl.time();
              caret.style.opacity = (tt < 0.35) ? 0 : (((tt % 0.86) < 0.47) ? 1 : 0.12);
            }
          }, 0);

          tl.fromTo("#s1-rule", { scaleX: 0, transformOrigin: "left center" },
                                { scaleX: 1, duration: 0.55, ease: "power4.out" }, 1.95);

          /* --- object: the shelf fills, one volume at a time, each dropping onto the rule --- */
          tl.fromTo("#s1-shelfline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power4.out" }, 0.55);
          for (var i = 1; i <= 6; i++) {
            var at = 0.9 + (i - 1) * 0.19;
            /* each volume sits at its own depth and its own slight yaw — real parallax */
            var zi = -50 + ((i * 37) % 5) * 24, ry = -14 + ((i * 53) % 5) * 5.5;
            tl.set("#s1-v" + i, { opacity: 1, y: 170, z: zi, rotationY: ry }, at);
            tl.to("#s1-v" + i, { y: 0, duration: 0.40, ease: "power4.out" }, at);
            /* the settle: a 4px bounce as it lands on the shelf */
            tl.to("#s1-v" + i, { y: -4, duration: 0.11, ease: "sine.inOut", yoyo: true, repeat: 1 }, at + 0.40);
          }
          tl.fromTo("#s1-shelftag", { opacity: 0, y: 14 },
                                    { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.2);
          /* the shelf breathes so it never reads as a still */
          var sc = 2.4, sr = Math.max(0, Math.floor((DUR - 2.3) / sc) - 1);
          tl.to("#s1-shelf", { y: -9, rotationY: 7, duration: sc, ease: "sine.inOut", yoyo: true, repeat: sr }, 2.3);
          tl.fromTo("#s1-ghost", { x: 0 }, { x: -60, duration: DUR, ease: "none" }, 0);

          /* --- rule: waterfall-entry — binary opacity, overlapping whip from below --- */
          var wave = [
            ["#s1-a1", 2.35, 66, 0.19], ["#s1-a2", 2.50, 50, 0.16],
            ["#s1-a3", 2.78, 46, 0.15], ["#s1-a4", 2.92, 72, 0.18], ["#s1-a5", 3.06, 40, 0.13],
            ["#s1-b1", 3.42, 50, 0.16], ["#s1-b2", 3.58, 80, 0.20], ["#s1-b3", 3.76, 36, 0.12],
            ["#s1-b4", 3.88, 68, 0.17]
          ];
          wave.forEach(function (w) {
            tl.set(w[0], { opacity: 1, y: w[2] }, w[1]);
            tl.to(w[0], { y: 0, duration: w[3], ease: "power4.out" }, w[1]);
          });
          /* the accent word slams: scale + blur snap, the film's first hit */
          tl.fromTo("#s1-b2", { scale: 1.32, filter: "blur(10px)" },
                              { scale: 1, filter: "blur(0px)", duration: 0.38, ease: "power4.out" }, 3.58);
          tl.set("#s1-b2", { filter: "none" }, 3.97);

          /* ---- handoff OUT: lateral page-push (s2 streaks in at the same wall time) ---- */
          tl.set("#s1-world", { filter: "blur(0px)" }, DUR - OUT);
          tl.to("#s1-world", { opacity: 0, x: -160, filter: "blur(16px)", duration: OUT, ease: "power3.in" }, DUR - OUT);

          window.__timelines = window.__timelines || {};
          window.__timelines["s1-cold-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
