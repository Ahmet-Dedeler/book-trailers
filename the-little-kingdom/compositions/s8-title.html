<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"IBM Plex Mono",monospace; color:#EFE7D6; }
        .world { position:absolute; inset:0; }
        .veil  { position:absolute; inset:0; background:rgba(11,10,9,.46); }
        .scrim { position:absolute; left:230px; top:-40px; width:1460px; height:1160px;
                 background:radial-gradient(ellipse closest-side, rgba(11,10,9,.96),
                   rgba(11,10,9,.80) 58%, rgba(11,10,9,0) 100%); }
        .halo { position:absolute; left:400px; top:40px; width:1120px; height:980px; opacity:0;
                background:radial-gradient(ellipse closest-side,
                  rgba(240,118,30,.58), rgba(240,118,30,.16) 48%, rgba(240,118,30,0) 74%); }

        /* ---- object: the jacket — a real six-face solid inside its own perspective ---- */
        .rig  { position:absolute; left:646px; top:96px; width:628px; height:824px;
                perspective:1600px; perspective-origin:50% 42%; }
        .book { position:absolute; inset:0; transform-style:preserve-3d; opacity:0; }
        .face { position:absolute; left:0; top:0; }
        .cover { width:628px; height:824px; overflow:hidden;
                 background:linear-gradient(160deg,#17140F 0%,#110F0B 60%,#0E0C09 100%);
                 box-shadow:0 0 0 1px rgba(239,231,214,.22) inset; }
        .back  { width:628px; height:824px; background:#0C0A07; box-shadow:0 0 0 1px rgba(239,231,214,.12) inset; }
        .fore  { width:56px; height:824px;
                 background:repeating-linear-gradient(to right, #CFC6B2 0 2px, #9E9683 2px 4px); }
        .head  { width:628px; height:56px;
                 background:repeating-linear-gradient(to right, #C8BFAB 0 3px, #A79E8B 3px 6px); }
        .tail  { width:628px; height:56px;
                 background:repeating-linear-gradient(to right, #B3AA97 0 3px, #918977 3px 6px); }
        .spine { width:56px; height:824px; background:linear-gradient(100deg,#1B1610,#100D09); overflow:hidden; }
        .spinestripe { position:absolute; left:0; top:0; width:12px; height:824px;
                       display:flex; flex-direction:column; }
        .spinestripe i, .stripe i { display:block; flex:1; }
        .spinetext { position:absolute; left:0; top:0; width:824px; height:56px;
                     display:flex; align-items:center; justify-content:center; gap:30px;
                     padding-left:12px; font-size:19px; letter-spacing:.24em; color:#EFE7D6;
                     text-transform:uppercase; white-space:nowrap; }

        /* the v4 cover: spectrum stripe down the left edge, cream band across the top */
        .stripe { position:absolute; left:0; top:0; width:44px; height:824px;
                  display:flex; flex-direction:column; }
        .band { position:absolute; left:44px; top:0; width:584px; height:340px; background:#E9DFC8; }
        .imprint { position:absolute; left:0; right:0; top:30px; text-align:center; font-size:19px;
                   letter-spacing:.30em; color:#1A1611; text-transform:uppercase; white-space:nowrap; opacity:0; }
        .title { position:absolute; left:0; right:0; top:66px; text-align:center;
                 font-family:"League Gothic",sans-serif; font-weight:400; text-transform:uppercase;
                 font-size:150px; line-height:.88; letter-spacing:-.02em; color:#1A1611; }
        .title span { display:block; opacity:0; }
        .sub { position:absolute; left:44px; right:0; top:414px; text-align:center; font-size:19px;
               letter-spacing:.14em; color:#EFE7D6; text-transform:uppercase; white-space:nowrap; opacity:0; }
        .brule { position:absolute; left:206px; width:260px; top:470px; height:2px; background:#F0761E; }
        .byline { position:absolute; left:44px; right:0; top:504px; text-align:center;
                  font-family:"League Gothic",sans-serif; font-weight:400; text-transform:uppercase;
                  font-size:84px; line-height:1; letter-spacing:.02em; color:#F0761E; white-space:nowrap; opacity:0; }
        .ghostyear { position:absolute; right:-14px; bottom:64px; font-family:"League Gothic",sans-serif;
                     font-size:250px; line-height:1; letter-spacing:-.02em; color:rgba(239,231,214,.06);
                     white-space:nowrap; opacity:0; }
        .colophon { position:absolute; left:44px; right:0; bottom:40px; text-align:center; font-size:18px;
                    letter-spacing:.26em; color:#9A8F7C; text-transform:uppercase; white-space:nowrap; opacity:0; }

        .foot { position:absolute; left:0; right:0; bottom:52px; height:38px; line-height:38px;
                text-align:center; font-size:22px; letter-spacing:.24em; color:#CFC4AE;
                text-transform:uppercase; white-space:nowrap; background:rgba(11,10,9,.78); opacity:0; }
        .black { position:absolute; inset:0; background:#0B0A09; opacity:0; }
      </style>

      <div id="root" data-composition-id="s8-title" data-start="0" data-duration="7.5"
           data-width="1920" data-height="1080">
        <div class="world" id="s8-world">
          <div class="veil" data-layout-ignore aria-hidden="true"></div>
          <div class="scrim" data-layout-ignore aria-hidden="true"></div>
          <div class="halo" id="s8-halo" data-layout-ignore aria-hidden="true"></div>

          <div class="rig" id="s8-rig">
            <div class="book" id="s8-book">
              <div class="face back"  id="s8-back"  data-layout-ignore aria-hidden="true"></div>
              <div class="face fore"  id="s8-fore"  data-layout-ignore aria-hidden="true"></div>
              <div class="face head"  id="s8-head"  data-layout-ignore aria-hidden="true"></div>
              <div class="face tail"  id="s8-tail"  data-layout-ignore aria-hidden="true"></div>
              <div class="face spine" id="s8-spine" data-layout-ignore aria-hidden="true">
                <div class="spinestripe">
                  <i id="s8-sc1" style="background:#61BB46"></i><i id="s8-sc2" style="background:#FCB61A"></i>
                  <i id="s8-sc3" style="background:#F5821F"></i><i id="s8-sc4" style="background:#E03A3E"></i>
                  <i id="s8-sc5" style="background:#963D97"></i><i id="s8-sc6" style="background:#009DDC"></i>
                </div>
                <div class="spinetext" id="s8-spinetext"><span>The Little Kingdom</span><span>Moritz</span><span>Morrow</span></div>
              </div>
              <div class="face cover" id="s8-cover">
                <div class="band" id="s8-band">
                  <div class="imprint" id="s8-imprint" data-layout-allow-overlap>William Morrow · New York</div>
                  <div class="title" id="s8-hero"><span id="s8-t1" data-layout-allow-overlap>The Little</span><span id="s8-t2" data-layout-allow-overlap>Kingdom</span></div>
                </div>
                <div class="stripe" id="s8-stripe">
                  <i id="s8-c1" style="background:#61BB46"></i><i id="s8-c2" style="background:#FCB61A"></i>
                  <i id="s8-c3" style="background:#F5821F"></i><i id="s8-c4" style="background:#E03A3E"></i>
                  <i id="s8-c5" style="background:#963D97"></i><i id="s8-c6" style="background:#009DDC"></i>
                </div>
                <div class="sub" id="s8-sub" data-layout-allow-overlap>The private story of Apple Computer</div>
                <div class="brule" id="s8-brule"></div>
                <div class="byline" id="s8-byline" data-layout-allow-overlap>Michael Moritz</div>
                <div class="ghostyear" id="s8-ghostyear" data-layout-ignore aria-hidden="true">1984</div>
                <div class="colophon" id="s8-colophon" data-layout-allow-overlap>William Morrow</div>
              </div>
            </div>
          </div>

          <div class="foot" id="s8-foot">First published 1984 · Reissued 2009 as "Return to the Little Kingdom"</div>
        </div>
        <div class="black" id="s8-black" data-layout-ignore aria-hidden="true"></div>
      </div>

      <script>
        (function () {
          var DUR = 7.5, D = 28;   /* half the block thickness, in px */
          var tl = gsap.timeline({ paused: true });

          /* Seat the six faces into a real box. Static poses, gsap.set at build time on
             non-clip elements — only the .book rig is animated. Every face's outward
             normal points out of the block, so nothing is seen mirrored. */
          gsap.set("#s8-cover", { z: D });
          gsap.set("#s8-back",  { z: -D, rotationY: 180 });
          gsap.set("#s8-fore",  { x: 628, z: D, rotationY: 90, transformOrigin: "left center" });
          gsap.set("#s8-spine", { x: 0, z: -D, rotationY: -90, transformOrigin: "left center" });
          gsap.set("#s8-head",  { y: 0, z: -D, rotationX: 90, transformOrigin: "center top" });
          gsap.set("#s8-tail",  { y: 824, z: D, rotationX: -90, transformOrigin: "center top" });
          gsap.set("#s8-spinetext", { rotation: 90, x: 56, y: 0, transformOrigin: "0 0" });

          /* ---- handoff IN (7→8 accent): from black, opacity only, a 1.04→1 settle ---- */
          tl.fromTo("#s8-world", { opacity: 0, scale: 1.04 },
                                 { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 0);

          /* --- blueprint: logo-assemble-lockup — the jacket turns into frame in real space,
                 then its parts arrive on the cover, then it holds on a slow orbit --- */
          tl.fromTo("#s8-book", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.15);
          tl.fromTo("#s8-book",
            { rotationY: -60, rotationX: 9, z: -600, y: 36 },
            { rotationY: -14, rotationX: 3, z: 0, y: 0, duration: 1.45, ease: "power4.out" }, 0.15);
          tl.fromTo("#s8-halo", { opacity: 0, scale: 0.8 },
                                { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, 0.3);

          tl.fromTo("#s8-imprint", { opacity: 0, y: 12 },
                                   { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" }, 0.95);
          tl.fromTo("#s8-t1", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.08);
          tl.fromTo("#s8-t2", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.22);
          /* the spectrum: six bands wipe down the left edge in sequence, cover and spine alike */
          for (var i = 1; i <= 6; i++) {
            tl.fromTo(["#s8-c" + i, "#s8-sc" + i], { scaleY: 0, transformOrigin: "center top" },
                      { scaleY: 1, duration: 0.3, ease: "power3.out" }, 1.4 + (i - 1) * 0.085);
          }
          tl.fromTo("#s8-sub", { opacity: 0, y: 16 },
                               { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.0);
          tl.fromTo("#s8-brule", { scaleX: 0, transformOrigin: "center center" },
                                 { scaleX: 1, duration: 0.5, ease: "power4.out" }, 2.1);
          tl.fromTo("#s8-byline", { opacity: 0, y: 24 },
                                  { opacity: 1, y: 0, duration: 0.54, ease: "power3.out" }, 2.22);
          tl.fromTo("#s8-colophon", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.5);
          tl.fromTo("#s8-ghostyear", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 1.2, ease: "power2.out" }, 2.4);
          tl.to("#s8-ghostyear", { x: -14, duration: DUR - 3.6, ease: "none" }, 3.6);
          tl.fromTo("#s8-foot", { opacity: 0, y: 14 },
                                { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.75);

          /* --- the hold is a slow orbit, so the solid keeps proving it has depth --- */
          tl.to("#s8-book", { rotationY: -5, rotationX: -1.5, duration: 3.7, ease: "sine.inOut" }, 2.9);
          var hc = 1.3, hr = Math.max(0, Math.floor((DUR - 0.8 - 1.5) / hc) - 1);
          tl.to("#s8-halo", { scale: 1.08, opacity: 0.76, duration: hc, ease: "sine.inOut", yoyo: true, repeat: hr }, 1.5);

          /* ---- the film ends: fade to black over the last 0.8s (the only exit in the film) ---- */
          tl.fromTo("#s8-black", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.in" }, DUR - 0.8);

          window.__timelines = window.__timelines || {};
          window.__timelines["s8-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
