<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"IBM Plex Mono",monospace; color:#EFE7D6; }
        .veil { position:absolute; inset:0; background:rgba(11,10,9,.46); }
        .scrim { position:absolute; left:160px; top:180px; width:1600px; height:720px;
                 background:radial-gradient(ellipse closest-side,
                   rgba(11,10,9,.94), rgba(11,10,9,.74) 58%, rgba(11,10,9,0) 100%); }
        .frame { position:absolute; left:300px; top:284px; width:1320px; height:512px; }
        .frame svg { display:block; width:1320px; height:512px; }
        .stage { position:absolute; inset:0; display:flex; flex-direction:column;
                 align-items:center; justify-content:center; padding:0 300px; }
        .line { font-family:"League Gothic",sans-serif; font-weight:400; text-transform:uppercase;
                font-size:146px; line-height:.98; letter-spacing:-.02em; color:#EFE7D6;
                text-align:center; opacity:0; }
        .line.two { color:#F0761E; }
        .mark { width:220px; height:2px; background:#9A8F7C; margin:40px 0; }
      </style>

      <div id="root" data-composition-id="s7-thesis" data-start="0" data-duration="5.5"
           data-width="1920" data-height="1080">
        <div class="veil" data-layout-ignore aria-hidden="true"></div>
        <div class="scrim" data-layout-ignore aria-hidden="true"></div>

        <!-- object: a single drawn page rule, the quietest possible frame -->
        <div class="frame">
          <svg viewBox="0 0 1320 512" fill="none" stroke="rgba(240,118,30,.55)"
               stroke-width="2.5" stroke-linejoin="round">
            <path id="s7-fr" d="M2 2 L1318 2 L1318 510 L2 510 Z"/>
          </svg>
        </div>

        <div class="stage" id="s7-stage">
          <div class="line" id="s7-l1">Before Apple was a myth,</div>
          <div class="mark" id="s7-mark"></div>
          <div class="line two" id="s7-l2">somebody was taking notes.</div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 5.5;
          var tl = gsap.timeline({ paused: true });

          /* --- rule: svg-path-draw — the page rules itself, one continuous stroke --- */
          var fr = document.getElementById("s7-fr"), L = fr.getTotalLength();
          tl.fromTo(fr, { strokeDasharray: L, strokeDashoffset: L },
                        { strokeDashoffset: 0, duration: 1.9, ease: "power2.inOut" }, 0.1);

          /* --- blueprint: titlecard-reveal — exactly ONE restrained move, then stillness --- */
          tl.fromTo("#s7-l1", { opacity: 0, y: 54 },
                              { opacity: 1, y: 0, duration: 0.82, ease: "power3.out" }, 0.28);
          tl.fromTo("#s7-mark", { scaleX: 0, transformOrigin: "center center" },
                                { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.82);
          tl.fromTo("#s7-l2", { opacity: 0, y: 54 },
                              { opacity: 1, y: 0, duration: 0.82, ease: "power3.out" }, 1.08);

          tl.to("#s7-stage", { scale: 1.026, duration: DUR - 2.0, ease: "sine.inOut" }, 2.0);

          window.__timelines = window.__timelines || {};
          window.__timelines["s7-thesis"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
