<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                background:#0B0A09; }
        #bg-gl { position:absolute; inset:0; width:1920px; height:1080px; display:block; }
        .vig { position:absolute; inset:0;
               background:radial-gradient(ellipse 78% 74% at 50% 48%,
                 rgba(0,0,0,0) 40%, rgba(0,0,0,.62) 100%); }
        .scan { position:absolute; left:0; right:0; top:-8px; height:1104px; opacity:.42;
                background:repeating-linear-gradient(to bottom,
                  rgba(239,231,214,.05) 0px, rgba(239,231,214,.05) 1px,
                  rgba(0,0,0,0) 1px, rgba(0,0,0,0) 4px); }
      </style>

      <!-- Linked, not inlined: keeping the library in a .js file keeps lint from scanning
           three.js's own Math.random/rAF internals as if they were this composition's code.
           Declared here and ONLY here, so exactly one instance loads. -->
      <script src="assets/three.min.js"></script>

      <div id="root" data-composition-id="bg-field" data-start="0" data-duration="60"
           data-width="1920" data-height="1080" data-layout-ignore aria-hidden="true">
        <canvas id="bg-gl"></canvas>
        <div class="vig"></div>
        <div class="scan" id="bg-scan"></div>
      </div>

      <script>
        (function () {
          var DUR = 60;
          var tl = gsap.timeline({ paused: true });

          /* Seeded PRNG — the whole world is reproducible, never Math.random(). */
          function mulberry(a) {
            return function () {
              a |= 0; a = a + 0x6D2B79F5 | 0;
              var t = Math.imul(a ^ a >>> 15, 1 | a);
              t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
          }

          var gl = null, built = false;
          function buildScene() {
            if (built || typeof THREE === "undefined") return gl;
            built = true;
            var canvas = document.getElementById("bg-gl");
            var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            /* Pinned, never read from devicePixelRatio: a 3840x2160 buffer so the
               --resolution 4k pass has real WebGL detail to sample, not an upscale. */
            renderer.setPixelRatio(2);
            renderer.setSize(1920, 1080, false);
            renderer.setClearColor(0x0B0A09, 1);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.82;
            if ("outputColorSpace" in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
            else if ("outputEncoding" in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;

            var scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0B0A09, 16, 104);
            var camera = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.1, 400);

            var rnd = mulberry(19810401);   /* Apple's incorporation year — the board's seed */
            var LEN = 560, HALF = 34;

            /* --- the substrate --- */
            var board = new THREE.Mesh(
              new THREE.PlaneGeometry(90, LEN + 120),
              new THREE.MeshStandardMaterial({ color: 0x090706, roughness: 1.0, metalness: 0.0 }));
            board.rotation.x = -Math.PI / 2;
            board.position.z = -LEN / 2;
            scene.add(board);

            /* --- copper traces: emissive, so they read as signal not surface --- */
            var traceGeo = new THREE.BoxGeometry(1, 0.05, 1);
            var traceMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: true });
            var TRACES = 1500;
            var traces = new THREE.InstancedMesh(traceGeo, traceMat, TRACES);
            var dummy = new THREE.Object3D(), col = new THREE.Color();
            var used = 0;
            for (var i = 0; i < TRACES; i++) {
              var z = 8 - rnd() * (LEN + 20);
              /* density and heat both climb with distance travelled: sparse schematic
                 at the top of the flight, dense live board by the end */
              var depth = Math.min(1, (-z + 8) / LEN);
              if (rnd() > 0.22 + depth * 0.78) continue;
              var x = (rnd() * 2 - 1) * HALF;
              var run = 3 + rnd() * 16;
              var horiz = rnd() < 0.5;
              dummy.position.set(x, 0.03, z);
              dummy.rotation.set(0, horiz ? Math.PI / 2 : 0, 0);
              if (rnd() < 0.22) dummy.rotation.y = Math.PI / 4;   /* 45° routing */
              dummy.scale.set(0.16, 1, run);
              dummy.updateMatrix();
              traces.setMatrixAt(used, dummy.matrix);
              var heat = 0.20 + depth * 0.65 + rnd() * 0.14;
              col.setRGB(0.94 * heat, 0.46 * heat, 0.12 * heat);
              traces.setColorAt(used, col);
              used++;
            }
            traces.count = used;
            traces.instanceMatrix.needsUpdate = true;
            if (traces.instanceColor) traces.instanceColor.needsUpdate = true;
            scene.add(traces);

            /* --- solder pads --- */
            var padGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.07, 10);
            var pads = new THREE.InstancedMesh(padGeo, traceMat.clone(), 700);
            var pused = 0;
            for (var p = 0; p < 700; p++) {
              var pz = 8 - rnd() * (LEN + 20);
              var pdepth = Math.min(1, (-pz + 8) / LEN);
              if (rnd() > 0.20 + pdepth * 0.8) continue;
              dummy.position.set((rnd() * 2 - 1) * HALF, 0.05, pz);
              dummy.rotation.set(0, 0, 0);
              dummy.scale.set(1, 1, 1);
              dummy.updateMatrix();
              pads.setMatrixAt(pused, dummy.matrix);
              var ph = 0.30 + pdepth * 0.6;
              col.setRGB(0.96 * ph, 0.50 * ph, 0.14 * ph);
              pads.setColorAt(pused, col);
              pused++;
            }
            pads.count = pused;
            pads.instanceMatrix.needsUpdate = true;
            if (pads.instanceColor) pads.instanceColor.needsUpdate = true;
            scene.add(pads);

            /* --- DIP packages: real solids, so they occlude and catch the key light --- */
            var chipGeo = new THREE.BoxGeometry(1, 1, 1);
            var chipMat = new THREE.MeshStandardMaterial({ color: 0x17120D, roughness: 0.62, metalness: 0.35 });
            var chips = new THREE.InstancedMesh(chipGeo, chipMat, 260);
            var cused = 0;
            for (var c = 0; c < 260; c++) {
              var cz = 4 - rnd() * (LEN + 10);
              var cdepth = Math.min(1, (-cz + 4) / LEN);
              if (rnd() > 0.10 + cdepth * 0.72) continue;
              var cw = 1.6 + rnd() * 3.4, cd = 1.0 + rnd() * 2.2;
              dummy.position.set((rnd() * 2 - 1) * HALF, 0.34, cz);
              dummy.rotation.set(0, rnd() < 0.5 ? 0 : Math.PI / 2, 0);
              dummy.scale.set(cw, 0.68, cd);
              dummy.updateMatrix();
              chips.setMatrixAt(cused, dummy.matrix);
              cused++;
            }
            chips.count = cused;
            chips.instanceMatrix.needsUpdate = true;
            scene.add(chips);

            /* --- lighting: the warm source now travels WITH the camera --- */
            scene.add(new THREE.AmbientLight(0x3a2415, 0.22));
            var key = new THREE.DirectionalLight(0xF0761E, 0.30);
            key.position.set(6, 14, 4);
            scene.add(key);
            var lamp = new THREE.PointLight(0xF0761E, 34, 58, 2.0);
            scene.add(lamp);
            var fill = new THREE.PointLight(0xEFE7D6, 9, 40, 2.0);
            scene.add(fill);

            /* --- the camera is the actor: one continuous 60s descent down the board --- */
            var state = { p: 0 };
            function render() {
              var p = state.p;
              var camZ = 14 - p * 512;
              var drift = Math.sin(p * Math.PI * 2.2) * 3.4;
              var rise = 6.2 + Math.sin(p * Math.PI * 1.4) * 1.5 + p * 1.6;
              camera.position.set(drift, rise, camZ);
              camera.lookAt(drift * 0.35, 2.4, camZ - 44);
              camera.rotation.z = Math.sin(p * Math.PI * 1.8) * 0.045;   /* slow bank */
              lamp.position.set(drift + Math.sin(p * Math.PI * 3.1) * 8, 7.5, camZ - 15);
              fill.position.set(drift - 6, 4.5, camZ - 6);
              renderer.render(scene, camera);
            }
            gl = { render: render, state: state };
            return gl;
          }

          /* One driver on the paused timeline — the registry's own Three.js pattern.
             Never requestAnimationFrame, never wall-clock. */
          var driver = { p: 0 };
          function renderAt() {
            var g = buildScene();
            if (!g) return;
            g.state.p = driver.p;
            g.render();
          }
          buildScene();
          renderAt();
          tl.to(driver, { p: 1, duration: DUR, ease: "none", onUpdate: renderAt }, 0);

          /* CRT field creeps over the plate — the film's texture, kept from v2 */
          tl.fromTo("#bg-scan", { y: 0 }, { y: 16, duration: DUR, ease: "none" }, 0);

          window.__timelines = window.__timelines || {};
          window.__timelines["bg-field"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
