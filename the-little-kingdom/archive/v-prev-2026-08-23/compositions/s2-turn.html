<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
                font-family:"IBM Plex Mono",monospace; color:#EFE7D6;
                perspective:1700px; perspective-origin:64% 48%; }
        .veil { position:absolute; inset:0; background:rgba(11,10,9,.46); }
        .scrim { position:absolute; left:-300px; top:150px; width:1580px; height:800px;
                 background:radial-gradient(ellipse closest-side,
                   rgba(11,10,9,.95), rgba(11,10,9,.76) 56%, rgba(11,10,9,0) 100%); }
        .stage { position:absolute; left:168px; top:0; bottom:0; width:1060px;
                 display:flex; flex-direction:column; justify-content:center; }
        .disp { font-family:"League Gothic",sans-serif; font-weight:400; text-transform:uppercase;
                font-size:206px; line-height:.92; letter-spacing:-.025em; color:#EFE7D6; }
        .rule { height:2px; background:#F0761E; width:100%; margin:40px 0 28px; }
        .meta { font-size:26px; letter-spacing:.2em; color:#9A8F7C; text-transform:uppercase; }
        .meta span { display:inline-block; opacity:0; }
        .meta .lead { color:#EFE7D6; }
        .amber { color:#F0761E; }
        /* --- object: the same shelf, minus one volume --- */
        .shelf { position:absolute; left:1250px; top:296px; width:560px; height:520px;
                 transform-style:preserve-3d; }
        .spine { position:absolute; bottom:34px; width:74px; border-radius:3px 3px 0 0;
                 background:linear-gradient(100deg,#241D15,#15110C); border:2px solid rgba(239,231,214,.34);
                 border-bottom:none; }
        .spine i { position:absolute; left:12px; right:12px; top:44px; height:3px;
                   background:rgba(239,231,214,.26); display:block; }
        .spine u { position:absolute; left:12px; right:12px; bottom:40px; height:3px;
                   background:rgba(239,231,214,.16); display:block; }
        .shelfline { position:absolute; left:0; bottom:28px; width:560px; height:3px;
                     background:rgba(240,118,30,.55); }
        /* the volume that leaves the shelf and turns to face you */
        .hero { position:absolute; left:110px; bottom:52px; width:286px; height:446px;
                background:#12100C; border:3px solid #F0761E; border-radius:4px;
                box-shadow:0 0 60px rgba(240,118,30,.28); }
        .hero .ht { position:absolute; left:24px; right:24px; top:44px;
                    font-family:"League Gothic",sans-serif; font-size:64px; line-height:.94;
                    text-transform:uppercase; color:#EFE7D6; opacity:0; }
        .hero .hr { position:absolute; left:24px; right:24px; top:196px; height:3px;
                    background:#F0761E; transform-origin:left center; }
        .hero .ha { position:absolute; left:24px; right:24px; bottom:36px; font-size:17px;
                    letter-spacing:.18em; text-transform:uppercase; color:#9A8F7C; opacity:0; }
      </style>

      <div id="root" data-composition-id="s2-turn" data-start="0" data-duration="6"
           data-width="1920" data-height="1080">
        <div class="veil" data-layout-ignore aria-hidden="true"></div>

        <div class="shelf" id="s2-shelf">
          <div class="spine" style="left:0;   height:420px"><i></i><u></u></div>
          <div class="spine" style="left:92px; height:462px"><i></i><u></u></div>
          <div class="spine" style="left:276px;height:446px"><i></i><u></u></div>
          <div class="spine" style="left:368px;height:412px"><i></i><u></u></div>
          <div class="spine" style="left:460px;height:434px"><i></i><u></u></div>
          <div class="shelfline"></div>
          <div class="hero" id="s2-hero">
            <div class="ht" id="s2-ht">The Little Kingdom</div>
            <div class="hr" id="s2-hr"></div>
            <div class="ha" id="s2-ha">Moritz · 1984</div>
          </div>
        </div>

        <div class="scrim" data-layout-ignore aria-hidden="true"></div>

        <div class="stage">
          <div class="disp"><span id="s2-slam">This one wasn't.</span></div>
          <div class="rule" id="s2-rule"></div>
          <div class="meta">
            <span class="lead" id="s2-m1">The Little Kingdom</span>
            <span id="s2-m2">&nbsp;·&nbsp; Michael Moritz</span>
            <span id="s2-m3">&nbsp;·&nbsp; William Morrow</span>
            <span class="amber" id="s2-m4">&nbsp;·&nbsp; 1984</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var DUR = 6;
          var tl = gsap.timeline({ paused: true });

          /* --- rule: kinetic-beat-slam + motion-blur-streak — the reversal is an impact --- */
          tl.fromTo("#s2-slam",
            { scale: 1.42, opacity: 0, filter: "blur(22px)" },
            { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.46, ease: "power4.out" }, 0.12);
          tl.to("#s2-slam", { scale: 0.995, duration: 0.16, ease: "power2.out" }, 0.62);
          tl.to("#s2-slam", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 0.80);
          tl.fromTo("#s2-rule", { scaleX: 0, transformOrigin: "left center" },
                                { scaleX: 1, duration: 0.7, ease: "power4.out" }, 0.62);

          /* --- object: the volume pulls out of the shelf and turns to face the viewer.
                 scaleX stands in for the rotation — a spine widening into a cover. --- */
          tl.fromTo("#s2-hero",
            { rotationY: -84, x: 0, y: 0, z: 0, rotation: 0, transformOrigin: "left center" },
            { rotationY: -16, x: -34, y: -92, z: 190, rotation: -3,
              duration: 0.92, ease: "power4.out" }, 0.30);
          tl.fromTo("#s2-ht", { opacity: 0, y: 16 },
                              { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.00);
          tl.fromTo("#s2-hr", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power4.out" }, 1.10);
          tl.fromTo("#s2-ha", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.26);
          /* it hangs there, breathing, for the rest of the beat */
          var hc = 2.2, hr2 = Math.max(0, Math.floor((DUR - 1.5) / hc) - 1);
          tl.to("#s2-hero", { y: -104, rotationY: -9, duration: hc, ease: "sine.inOut", yoyo: true, repeat: hr2 }, 1.5);

          /* --- rule: waterfall-entry — the bibliographic line assembles left to right --- */
          var wave = [["#s2-m1", 1.05, 40, 0.16], ["#s2-m2", 1.20, 34, 0.14],
                      ["#s2-m3", 1.33, 34, 0.14], ["#s2-m4", 1.46, 44, 0.16]];
          wave.forEach(function (w) {
            tl.set(w[0], { opacity: 1, y: w[2] }, w[1]);
            tl.to(w[0], { y: 0, duration: w[3], ease: "power4.out" }, w[1]);
          });
          tl.fromTo("#s2-m4", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.46);
          tl.to("#s2-slam", { y: -8, duration: DUR - 1.3, ease: "sine.inOut" }, 1.3);

          window.__timelines = window.__timelines || {};
          window.__timelines["s2-turn"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
